<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledger Reconciliation (Group-wise) Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
<style>
/* Single light theme on purpose: mirrors the client's existing light enterprise UI (same as the other VMB prototypes). */
:root { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #F4F5F7; }
body { font-family: 'Roboto', Arial, sans-serif; color: #1F1F1F; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; }
:focus-visible { outline: 2px solid #1565C0; outline-offset: 2px; }

.viewbar { background: #0B2545; color: #fff; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 7px 20px; font-size: 13px; }
.viewbar a { color: #fff; text-decoration: none; padding: 4px 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,.35); }
.viewbar a.on { background: #fff; color: #0B2545; font-weight: 700; border-color: #fff; }
.viewbar a:not(.on):hover { background: rgba(255,255,255,.12); }
.topbar { background: #fff; display: flex; align-items: center; flex-wrap: wrap; gap: 14px 26px; padding: 10px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); position: relative; z-index: 6; }
.iconbtn { border: 0; background: none; padding: 6px; cursor: pointer; display: flex; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand img { width: 34px; height: 34px; }
.brand b { font-size: 22px; color: #1565C0; }
.search { display: flex; flex: 0 1 360px; min-width: 220px; }
.search input { flex: 1; min-width: 0; height: 40px; border: 1px solid #E0E0E0; border-right: 0; background: #F5F5F5; padding: 0 12px; font-size: 14px; }
.search button { width: 48px; height: 40px; border: 0; background: #4CAF50; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: #3C4043; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 500; }
.proto-pill { font-size: 11px; font-weight: 700; color: #7A4B00; background: #FFF3E0; border: 1px solid #F0C36D; border-radius: 4px; padding: 3px 8px; white-space: nowrap; }

.layout { display: flex; flex-wrap: wrap; align-items: stretch; }
aside { background: #fff; border-right: 1px solid #E3E5E8; padding: 6px 0; flex: 1 1 240px; max-width: 260px; }
aside.mini { flex: 0 0 56px; }
aside.mini .lbl, aside.mini .sub { display: none; }
.nav { display: flex; align-items: center; gap: 14px; padding: 0 16px; height: 50px; font-weight: 500; font-size: 15px; color: #1F1F1F; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; }
.nav:hover { background: #F1F5FB; }
.nav.on { background: #E3EEFA; }
.nav svg { flex: none; }
.nav .lbl { flex: 1; display: flex; justify-content: space-between; }
.sub { display: block; width: 100%; padding: 11px 16px 11px 50px; font-weight: 500; font-size: 13px; color: #1F1F1F; border: 0; background: #F0F1F3; text-align: left; cursor: pointer; }
.sub.on { background: #DCE8F7; color: #0D47A1; font-weight: 700; }

main { flex: 999 1 560px; min-width: 0; padding: 14px 20px 48px; display: flex; flex-direction: column; gap: 14px; }
.tabs { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.tab { height: 46px; min-width: 120px; padding: 0 18px; border: 1px solid #1F1F1F; border-radius: 3px; background: #fff; font-weight: 700; font-size: 15px; color: #1F1F1F; cursor: pointer; }
.tab.on { background: #1565C0; border-color: #1565C0; color: #fff; }

.card { background: #fff; border-radius: 4px; }
.filters { padding: 18px 16px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; position: relative; z-index: 5; }
.fld { display: flex; flex-direction: column; gap: 5px; position: relative; }
.fld > label { font-size: 12px; color: #3C4043; }
.req { color: #B3261E; }
.ctl { height: 38px; border: 1px solid #1F1F1F; border-radius: 2px; background: #fff; display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 13px; color: #1F1F1F; cursor: pointer; width: 100%; text-align: left; }
.ctl:disabled { border-color: #C9CDD3; color: #80868B; background: #F1F2F4; cursor: not-allowed; }
.ctl.active { border-color: #1565C0; box-shadow: 0 0 0 2px rgba(21,101,192,.18); }
.ctl .val { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop { position: absolute; top: 64px; left: 0; background: #fff; border: 1px solid #DADCE0; border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.14); overflow: hidden; }
.pop .scroll { max-height: 280px; overflow-y: auto; padding: 4px 0; }
.pop .srch { padding: 10px; border-bottom: 1px solid #ECEEF1; }
.pop .srch input { width: 100%; height: 36px; border: 1px solid #C9CDD3; border-radius: 3px; padding: 0 10px; font-size: 13px; }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border: 0; background: #fff; text-align: left; font-size: 13px; color: #1F1F1F; cursor: pointer; }
.opt:hover { background: #EEF4FB; }
.opt.sel { background: #E3EEFA; font-weight: 500; }
.opt small { font-size: 12px; color: #5F6368; }
.chk { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
.chk:hover { background: #EEF4FB; }
.chk input { width: 16px; height: 16px; accent-color: #1565C0; margin: 0; }
.chk.all { border-bottom: 1px solid #ECEEF1; font-weight: 500; }
.actions { display: flex; align-items: center; gap: 12px; border-left: 1px solid #E3E5E8; padding-left: 14px; margin-left: auto; }
.apply { height: 40px; padding: 0 24px; border: 0; border-radius: 3px; background: #1565C0; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
.apply:disabled { background: #9DB9DC; cursor: not-allowed; }
.txtbtn { border: 0; background: none; font-weight: 700; font-size: 15px; cursor: pointer; padding: 8px 4px; display: flex; align-items: center; gap: 6px; }
.txtbtn:disabled { color: #9AA0A6; cursor: not-allowed; }

.empty { padding: 64px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.empty h3 { margin: 0; font-size: 16px; font-weight: 500; }
.empty p { margin: 0; font-size: 14px; color: #5F6368; max-width: 470px; }

.results { padding: 18px 16px 8px; }
.ghead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 28px; }
.ghead div { display: flex; gap: 10px; align-items: baseline; }
.ghead span { font-size: 15px; color: #5F6368; }
.ghead b { font-size: 18px; font-weight: 500; }
.collapse { border: 0; background: none; font-size: 22px; color: #5F6368; cursor: pointer; padding: 0 6px; margin-left: auto; }
.sumbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-top: 18px; }
.chip { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; font-weight: 500; font-size: 12px; white-space: nowrap; }
.pager { display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 13px; }
.pg { border: 0; background: none; font-weight: 700; font-size: 13px; color: #1F1F1F; cursor: pointer; padding: 3px 7px; border-radius: 3px; }
.pg.on { background: #3C4043; color: #fff; }
.pg.last { color: #1565C0; }
.pg:disabled { color: #9AA0A6; cursor: not-allowed; }

.p-verified { background: #E8F5E9; color: #2E7D32; }
.p-pending { background: #FFF3E0; color: #8A4B00; }
.p-disputed { background: #FDECEA; color: #B3261E; }
.p-exception { background: #F1EAFB; color: #5B2E91; }

.rec { padding: 22px 0 8px; }
.rline { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.kv { display: flex; flex-direction: column; gap: 3px; padding-right: 16px; border-right: 1px solid #DADCE0; }
.kv:nth-child(5) { border-right: 0; }
.kv span { font-size: 13px; color: #3C4043; }
.kv b { font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rright { display: flex; align-items: center; gap: 14px; margin-left: auto; }
.pill { display: inline-flex; align-items: center; height: 36px; padding: 0 12px; border-radius: 4px; font-size: 15px; white-space: nowrap; }
.tds { height: 36px; padding: 0 12px; border: 0; border-radius: 4px; background: #E3E3E3; color: #5F6368; font-size: 15px; cursor: pointer; }
.exp { width: 22px; height: 22px; border: 0; border-radius: 2px; background: #1565C0; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }

.detail { margin-top: 18px; border: 1px solid #E3E5E8; overflow-x: auto; }
.dgrid { min-width: 900px; display: grid; grid-template-columns: 2fr 1fr 2fr 2fr 2fr; gap: 16px; padding: 14px 16px; font-size: 15px; align-items: start; }
.dgrid.h { background: #EEF0F3; font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 7px; }
.lnk { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; font-weight: 500; font-size: 15px; color: #1565C0; cursor: pointer; text-align: left; }
.lnk:hover { color: #0D47A1; text-decoration: underline; }
.muted { color: #5F6368; }
.btnO { height: 38px; padding: 0 15px; border: 1px solid #1565C0; border-radius: 3px; background: #fff; color: #1565C0; font-weight: 500; font-size: 15px; cursor: pointer; }

.toast { position: fixed; right: 24px; bottom: 24px; background: #1F1F1F; color: #fff; font-size: 14px; padding: 12px 16px; border-radius: 4px; box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 50; }
@media (max-width: 720px) { .search, .hide-sm { display: none; } .actions { border-left: 0; padding-left: 0; margin-left: 0; } }
</style>
</head>

function derive() {
  const g = grp();
  const custs = g ? g.customers : [];
  const chosen = custs.filter((c) => S.selected.includes(c[0]));
  const recs = [];
  chosen.forEach((c) => {
    if (S.aRegion !== 'All' && c[2] !== S.aRegion) return;
    c[3].forEach((r) => {
      if (S.aDur !== 'All' && r[0] !== S.aDur) return;
      if (S.aStatus !== 'All' && r[3] !== S.aStatus) return;
      recs.push({ c, r });
    });
  });
  const nPages = Math.max(1, Math.ceil(recs.length / PER));
  const page = Math.min(S.page, nPages - 1);
  return { g, custs, chosen, recs, nPages, page };
}

  }
  const act = el.dataset.act;
  if (act === 'cust' || act === 'all') return; // handled on change
  const { g, custs, recs } = derive();
  switch (act) {
    case 'nav': set({ navOpen: !S.navOpen }); break;
    case 'soon': flash('Existing screen – not part of this prototype'); break;
    case 'menu': set({ menu: S.menu === el.dataset.m ? null : el.dataset.m }); break;
    case 'pick': {
      const x = GROUPS.find((y) => y.code === el.dataset.code);
      set(Object.assign({ group: x.code, selected: x.customers.map((c) => c[0]), open: {}, menu: null, search: '', page: 0, bodyOpen: true }, RESET));
      break;
    }
    case 'apply': set({ aStatus: S.dStatus, aRegion: S.dRegion, aDur: S.dDur, page: 0, menu: null }); break;
    case 'clear': set(Object.assign({ group: null, selected: [], open: {}, menu: null, search: '', page: 0 }, RESET)); break;
    case 'export': S.menu = null; flash(`Exported ${recs.length} records of ${g ? g.code : ''} to Excel`); break;
    case 'collapse': set({ bodyOpen: !S.bodyOpen }); break;
    case 'page': set({ page: +el.dataset.n }); break;
    case 'row': { const o = Object.assign({}, S.open); o[el.dataset.key] = !o[el.dataset.key]; set({ open: o }); break; }
    case 'toast': flash(el.dataset.msg); break;
  }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.f) { S[el.dataset.f] = el.value; return; }
  if (el.dataset.act === 'cust') {
    const code = el.dataset.code;
    set({ page: 0, selected: S.selected.includes(code) ? S.selected.filter((x) => x !== code) : S.selected.concat([code]) });
  } else if (el.dataset.act === 'all') {
    const { custs, chosen } = derive();
    set({ page: 0, selected: chosen.length === custs.length ? [] : custs.map((c) => c[0]) });
  }
});
document.addEventListener('input', (e) => { if (e.target.id === 'gsearch') set({ search: e.target.value }); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.menu) set({ menu: null }); });

render();
</script>
</body></html>
