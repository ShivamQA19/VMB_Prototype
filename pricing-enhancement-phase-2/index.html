<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pricing Enhancement Phase 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light}
body{margin:0;font-family:Roboto,Arial,sans-serif;background:#F3F4F6;color:#212529}
a{color:#0B5CAD}a:hover{color:#08427D}
.btn{height:40px;padding:0 20px;border-radius:4px;font:500 14px Roboto,Arial,sans-serif;cursor:pointer;border:1px solid #0B5CAD;background:#0B5CAD;color:#fff;letter-spacing:.02em}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-o{background:#fff;color:#0B5CAD}
.btn-q{background:#fff;color:#212529;border-color:#fff}
.tab{height:44px;padding:0 14px;border:1px solid #212529;border-radius:4px;background:#fff;font:600 15px Roboto,Arial,sans-serif;color:#212529;cursor:pointer}
.tab-on{background:#0B5CAD;border-color:#0B5CAD;color:#fff}
.inp{height:40px;border:1px solid #6C757D;border-radius:4px;padding:0 12px;font:14px Roboto,Arial,sans-serif;box-sizing:border-box;background:#fff;color:#212529;width:100%}
.inp[readonly]{background:#E0E0E0;border-color:#BDBDBD;color:#212529}
.lbl{font-size:14px;color:#212529;display:block;margin-bottom:6px}
.lnk{background:none;border:0;padding:3px 0;color:#0B5CAD;font:500 13px Roboto,Arial,sans-serif;cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-align:left}
.lnk:disabled{color:#8A8F94;cursor:not-allowed}
.card{background:#fff;border-radius:6px}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500;line-height:16px}
.muted{color:#5F6368}
.thead{display:grid;background:#E9ECEF;font-weight:600;font-size:14px}
.trow{display:grid;border-bottom:1px solid #E0E0E0;font-size:14px;background:#fff}
.thead>div,.trow>div{padding:14px 10px;min-width:0;overflow-wrap:anywhere}
.ln{margin-bottom:6px}
.g-po{grid-template-columns:150px 1.7fr 0.8fr 1.1fr 1.5fr 1fr 1.1fr 1.3fr}
.g-spo{grid-template-columns:44px 1.3fr 2fr 0.8fr 1.1fr 1.4fr 1fr 1.4fr 1.1fr}
.chk{width:20px;height:20px;cursor:pointer;accent-color:#0B5CAD;margin:0}
.g-cpb{grid-template-columns:repeat(12,minmax(0,1fr))}
.g-spb{grid-template-columns:repeat(11,minmax(0,1fr))}
.g-dash{grid-template-columns:repeat(16,minmax(0,1fr))}
.g-exc{grid-template-columns:70px 1.4fr 1fr 1fr 1.1fr 0.8fr 0.8fr 0.8fr 2fr 1fr 1fr}
.step{width:36px;height:40px;border:1px solid #BDBDBD;background:#F5F5F5;font-size:18px;cursor:pointer;color:#212529}
.icon-btn{width:40px;height:40px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#212529}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.err{color:#B3261E;font-size:13px;margin-top:8px}
.sec-h{font-size:16px;font-weight:500;color:#5F6368;margin:0 0 16px}
.pcard{display:flex;flex-direction:column;align-items:stretch;padding:12px;border-radius:6px;transition:box-shadow .15s}
.pcard:hover{box-shadow:0 4px 18px rgba(0,0,0,.10)}
.pimg-btn{border:0;background:none;padding:0;cursor:pointer}
.buy{height:46px;border:1px solid #0B5CAD;background:#fff;color:#0B5CAD;font:600 16px Roboto,Arial,sans-serif;border-radius:2px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.buy:hover{background:#EEF4FB}
.ptab{height:58px;padding:0 22px;border:1px solid transparent;border-bottom:0;background:none;font:600 16px Roboto,Arial,sans-serif;color:#212529;cursor:pointer;border-radius:6px 6px 0 0;margin-bottom:-1px}
.ptab-on{color:#0B5CAD;border-color:#DEE2E6;background:#fff}
.acc{margin-top:8px}
.acc-h{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:18px 0;font:500 18px Roboto,Arial,sans-serif;color:#212529;cursor:pointer;text-align:left}
.qbtn{width:38px;height:38px;border:0;border-radius:4px;background:#0B5CAD;color:#fff;font-size:22px;cursor:pointer;line-height:1}
.bigbtn{display:block;width:100%;height:46px;border:0;border-radius:4px;color:#fff;font:600 16px Roboto,Arial,sans-serif;letter-spacing:.02em;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.18)}
.bigbtn:disabled,.inp:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:720px){.rail{display:none!important}.split{border-left:0!important;padding-left:0!important}}
