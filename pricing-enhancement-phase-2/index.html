<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pricing Enhancement Phase 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light}
body{margin:0;font-family:Roboto,Arial,sans-serif;background:#F3F4F6;color:#212529}
a{color:#0B5CAD}a:hover{color:#08427D}
.btn{height:40px;padding:0 20px;border-radius:4px;font:500 14px Roboto,Arial,sans-serif;cursor:pointer;border:1px solid #0B5CAD;background:#0B5CAD;color:#fff;letter-spacing:.02em}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-o{background:#fff;color:#0B5CAD}
.btn-q{background:#fff;color:#212529;border-color:#fff}
.tab{height:44px;padding:0 14px;border:1px solid #212529;border-radius:4px;background:#fff;font:600 15px Roboto,Arial,sans-serif;color:#212529;cursor:pointer}
.tab-on{background:#0B5CAD;border-color:#0B5CAD;color:#fff}
.inp{height:40px;border:1px solid #6C757D;border-radius:4px;padding:0 12px;font:14px Roboto,Arial,sans-serif;box-sizing:border-box;background:#fff;color:#212529;width:100%}
.inp[readonly]{background:#E0E0E0;border-color:#BDBDBD;color:#212529}
.lbl{font-size:14px;color:#212529;display:block;margin-bottom:6px}
.lnk{background:none;border:0;padding:3px 0;color:#0B5CAD;font:500 13px Roboto,Arial,sans-serif;cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-align:left}
.lnk:disabled{color:#8A8F94;cursor:not-allowed}
.card{background:#fff;border-radius:6px}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500;line-height:16px}
.muted{color:#5F6368}
.thead{display:grid;background:#E9ECEF;font-weight:600;font-size:14px}
.trow{display:grid;border-bottom:1px solid #E0E0E0;font-size:14px;background:#fff}
.thead>div,.trow>div{padding:14px 10px;min-width:0;overflow-wrap:anywhere}
.ln{margin-bottom:6px}
.g-po{grid-template-columns:150px 1.7fr 0.8fr 1.1fr 1.5fr 1fr 1.1fr 1.3fr}
.g-spo{grid-template-columns:44px 1.3fr 2fr 0.8fr 1.1fr 1.4fr 1fr 1.4fr 1.1fr}
.chk{width:20px;height:20px;cursor:pointer;accent-color:#0B5CAD;margin:0}
.g-cpb{grid-template-columns:repeat(12,minmax(0,1fr))}
.g-spb{grid-template-columns:repeat(11,minmax(0,1fr))}
.g-dash{grid-template-columns:repeat(16,minmax(0,1fr))}
.g-exc{grid-template-columns:70px 1.4fr 1fr 1fr 1.1fr 0.8fr 0.8fr 0.8fr 2fr 1fr 1fr}
.step{width:36px;height:40px;border:1px solid #BDBDBD;background:#F5F5F5;font-size:18px;cursor:pointer;color:#212529}
.icon-btn{width:40px;height:40px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#212529}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.err{color:#B3261E;font-size:13px;margin-top:8px}
.sec-h{font-size:16px;font-weight:500;color:#5F6368;margin:0 0 16px}
@media (max-width:720px){.rail{display:none!important}.split{border-left:0!important;padding-left:0!important}}

      <div style="width:190px"><label class="lbl" for="ftype" style="font-size:12px">Order Type</label><select id="ftype" class="inp" value=${v.supType} onChange=${v.setSupType}>${v.typeOpts.map(opt)}</select></div>
      <div style="flex:1"></div>
      ${v.isRM ? html`<label style="display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;height:40px;cursor:pointer"><input type="checkbox" class="chk" checked=${v.allSel} onChange=${v.toggleAll} disabled=${v.noSelectable} /> Select All</label>` : null}
      ${v.isRM ? html`<button type="button" class="btn" disabled=${v.noSel} onClick=${v.bulkApprove}>APPROVE SELECTED (${v.selCount})</button>` : null}
      <button type="button" class="btn" onClick=${v.applied}>APPLY</button>
      <button type="button" class="lnk" style="font-size:15px" onClick=${v.exported}>Export Data</button>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:14px">
      <span class="badge" style="background:#E3F2FD;color:#0B3D73;font-size:13px">Pending with ${v.role}: ${v.pendingCount}</span>
      <span class="muted">Showing ${v.supCount} records</span>
    </div>
    <div class="card" style="overflow-x:auto"><div style="min-width:1240px">
      <div class="thead g-spo"><div>${v.isRM ? html`<input type="checkbox" class="chk" aria-label="Select all plans pending with RM" checked=${v.allSel} onChange=${v.toggleAll} disabled=${v.noSelectable} />` : null}</div><div>Customer ID / Name</div><div>Order Details</div><div>Price In</div><div>Product Description</div><div>Quantity (MT)</div><div>Created Date</div><div>Status</div><div>Action</div></div>
      ${v.supItems.map(function (it) { return html`<div key=${it.id} class="trow g-spo" style=${it.rowStyle}>
        <div>${it.canSelect ? html`<input type="checkbox" class="chk" aria-label=${it.selLabel} checked=${it.sel} onChange=${it.toggle} />` : null}</div>
        <div><div style="color:#0B5CAD;font-weight:500">${it.custId}</div><div>${it.custName}</div></div>
        <div>
          ${it.isReq ? html`<div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><span class="badge" style="background:#EDE7F6;color:#4527A0">${it.typeLabel}</span>${it.exception ? html`<span class="badge" style="background:#FFF4E5;color:#7A4A00">Beyond M+2 · ASM exception</span>` : null}</div>
            <div class="ln">Request ID: ${it.id}</div>
            <div class="ln">PO ID: <span style="color:#0B5CAD">${it.po}</span></div>
            <div class="ln">Price Type: ${it.priceType}</div>
            <div class="ln">Origin delivery: ${it.origin} · Price-by: ${it.priceBy}</div>
            ${it.hasFile ? html`<div class="ln">Attachment: <span style="color:#0B5CAD">${it.file}</span></div>` : null}
            ${it.hasSc ? html`<div class="ln">${it.scLine}</div>` : null}
            ${it.hasBw ? html`<div class="ln">${it.bwLine}</div>` : null}
            ${it.hasReason ? html`<div class="ln" style="color:#B3261E">Reason: ${it.reason}</div>` : null}
          </div>` : html`<div>
            <div class="ln">Price Type: ${it.priceType}</div>
            <div class="ln">PO ID: <span style="color:#0B5CAD">${it.id}</span></div>
            <div class="ln">Delivery In: ${it.origin}</div>
            <div class="ln">MoU No: ${it.mou}</div>
            ${it.hasEff ? html`<div class="ln">${it.effLine}</div>` : null}
            <div class="muted" style="font-size:12px">${it.kind}</div>
          </div>`}
        </div>
        <div>${it.priceIn}</div>
        <div>${it.product}</div>
        <div>${it.qtyLines.map(function (q) { return html`<div key=${q} class="ln">${q}</div>`; })}</div>
        <div>${it.created}</div>
        <div><div style=${'color:' + it.statusColor}>● ${it.status}</div>${it.hasTrail ? html`<div class="muted" style="font-size:12px;margin-top:6px">${it.trail}</div>` : null}</div>
        <div style="display:flex;flex-direction:column;align-items:flex-start;gap:2px">
          ${it.actionable ? html`<button type="button" class="lnk" onClick=${it.approve}>✓ Approve</button>` : null}
          ${it.actionable ? html`<button type="button" class="lnk" onClick=${it.reject}>✕ ${it.rejectLabel}</button>` : null}
          ${it.actionable && it.isPo ? html`<button type="button" class="lnk" onClick=${it.edit}>Edit</button>` : null}
          ${it.canException ? html`<button type="button" class="lnk" onClick=${it.raiseException}>Raise Rollover (exception)</button>` : null}
          ${it.noAction ? html`<span>–</span>` : null}
        </div>
      </div>`; })}
      ${v.supEmpty ? html`<div style="padding:32px;text-align:center" class="muted">No records match these filters.</div>` : null}
    </div></div>
  </div>` : null}

  ${v.vSupPB ? html`<div>
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px">
      <div class="muted" style="font-size:14px;flex:1 1 400px">Only plan orders with at least one pricing are shown here. A plan appears once the customer creates pricing against it.</div>
      ${v.canManual ? html`<button type="button" class="btn" onClick=${v.openManual}>+ ADD MANUAL PRICING (HZL DIRECT)</button>` : null}
    </div>
    ${v.pbGroups.map(function (g) { return html`<div key=${g.id} class="card" style="margin-bottom:14px;overflow-x:auto"><div style="min-width:1250px">
      <div style="display:flex;flex-wrap:wrap;gap:8px 28px;padding:14px 16px;font-size:14px;border-bottom:1px solid #E0E0E0">
        <span style="color:#0B5CAD;font-weight:700">${g.id}</span><span>${g.cust}</span><span>${g.product}</span><span>Delivery: ${g.deliv}</span><span>Planned: ${g.planned}</span><span>Priced: ${g.priced}</span><span style="font-weight:500">Unpriced: ${g.unpriced}</span>
      </div>
      <div class="thead g-spb" style="font-size:13px"><div>Booking ID</div><div>Price Type</div><div>Pricing Month</div><div>Qty (MT)</div><div>LME (USD/MT)</div><div>Service Charge</div><div>C / B</div><div>Booked At</div><div>Source</div><div>Status</div><div>Action</div></div>
      ${g.lines.map(function (b) { return html`<div key=${b.id} class="trow g-spb" style="font-size:13px"><div>${b.id}</div><div>${b.type}</div><div>${b.pm}</div><div>${b.qty}</div><div>${b.lme}</div><div>${b.sc}</div><div>${b.cb}</div><div>${b.at}</div><div><span class="badge" style=${b.sourceStyle}>${b.source}</span><div class="muted" style="font-size:12px;margin-top:4px">${b.enteredBy}</div></div><div style=${'color:' + b.statusColor}>● ${b.status}</div>
        <div>${b.canAct ? html`<div><button type="button" class="lnk" onClick=${b.approve}>✓ Approve</button><br /><button type="button" class="lnk" onClick=${b.reject}>✕ Reject</button></div>` : html`<span>–</span>`}</div></div>`; })}
    </div></div>`; })}
  </div>` : null}

  ${v.vDash ? html`<div>
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px">
      <div class="muted" style="font-size:14px;flex:1 1 400px">Planned, Net Priced and Booked quantities are shown separately and are not summed. Deal ID and Deal Ticket ID are hidden from this view.</div>
      <button type="button" class="btn" onClick=${v.exported}>EXPORT TO EXCEL</button>
    </div>
    <div class="card" style="overflow-x:auto"><div style="min-width:2050px">
      <div class="thead g-dash" style="font-size:13px"><div>Customer Name</div><div>Customer Code</div><div>Product</div><div>Region</div><div>Price Type</div><div>Delivery Month</div><div>Pricing Month</div><div>Planned Qty</div><div>Net Priced Qty</div><div>Booked Qty</div><div>Created Date</div><div>Booking Date / Time</div><div>Status</div><div>LME (USD/MT)</div><div>Service Charges</div><div>Contango / Backwardation</div></div>
      ${v.dashRows.map(function (d, i) { return html`<div key=${i} class="trow g-dash" style="font-size:13px"><div>${d.name}</div><div>${d.code}</div><div>${d.product}</div><div>${d.region}</div><div>${d.type}</div><div>${d.deliv}</div><div>${d.pm}</div><div>${d.planned}</div><div>${d.netPriced}</div><div>${d.booked}</div><div>${d.created}</div><div>${d.at}</div><div style=${'color:' + d.statusColor}>● ${d.status}</div><div>${d.lme}</div><div>${d.sc}</div><div>${d.cb}</div></div>`; })}
    </div></div>
  </div>` : null}

  ${v.vExc ? html`<div>
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px">
      <span class="badge" style="background:#FDECEA;color:#8C1D18;font-size:13px">Open: ${v.excOpen}</span>
      <span class="badge" style="background:#FFF4E5;color:#7A4A00;font-size:13px">Re-sync pending: ${v.excResync}</span>
      <span class="badge" style="background:#E8F5E9;color:#1B5E20;font-size:13px">Resolved: ${v.excResolved}</span>
      <div class="muted" style="font-size:14px;flex:1 1 300px">SAP-fetched plans compared with VMB-approved plans. Variance = VMB − SAP.</div>
      <button type="button" class="btn" onClick=${v.exported}>EXPORT</button>
    </div>
    <div class="card" style="overflow-x:auto"><div style="min-width:1350px">
      <div class="thead g-exc" style="font-size:13px"><div>Code</div><div>Customer / Code</div><div>Product</div><div>Delivery Month</div><div>Plan Reference</div><div>SAP Qty</div><div>VMB Qty</div><div>Variance</div><div>Message</div><div>Reconciliation Status</div><div>Action</div></div>
      ${v.excRows.map(function (x) { return html`<div key=${x.ref} class="trow g-exc" style="font-size:13px"><div style="font-weight:700">${x.code}</div><div>${x.cust}</div><div>${x.product}</div><div>${x.month}</div><div style="color:#0B5CAD">${x.ref}</div><div>${x.sap}</div><div>${x.vmb}</div><div style="font-weight:500">${x.vari}</div><div>${x.msg}</div><div style=${'color:' + x.statusColor}>● ${x.status}</div>
        <div>${x.open ? html`<div><button type="button" class="lnk" onClick=${x.resync}>Re-sync</button><br /><button type="button" class="lnk" onClick=${x.resolve}>Mark resolved</button></div>` : html`<span>–</span>`}</div></div>`; })}
    </div></div>
  </div>` : null}
</main>
</div>

${v.hasToast ? html`<div role="status" style="position:fixed;top:120px;left:50%;transform:translateX(-50%);background:#F1F8E9;border:1px solid #7CB342;color:#1B5E20;border-radius:6px;padding:14px 28px;font-size:15px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:260;max-width:90vw;text-align:center">${v.toast}</div>` : null}

${v.mReq ? overlay('mreqt', 540, html`<div>
  ${mHead('mreqt', v.mr.title)}
  <div style="background:#F5F7FA;border-radius:6px;padding:12px 14px;margin:16px 0;font-size:13px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 16px">
    <div>PO ID: <b>${v.mr.po}</b></div><div>Customer: ${v.mr.cust}</div>
    <div>Origin delivery: ${v.mr.origin}</div><div>Price-by: ${v.mr.priceBy}</div>
    <div>Non-priced qty: ${v.mr.unpriced} MT</div><div>Available now: <b>${v.mr.available} MT</b></div>
  </div>
  <label class="lbl" for="mrqty">Quantity (MT)</label>
  <input id="mrqty" class="inp" inputMode="decimal" value=${f.qty || ''} onChange=${v.mr.setQty} placeholder="Up to the available quantity" />
  <label class="lbl" for="mrtype" style="margin-top:14px">Price Type</label>
  <select id="mrtype" class="inp" value=${f.priceType} onChange=${v.mr.setType}>${v.mr.ptOpts.map(opt)}</select>
  <label class="lbl" for="mrmonth" style="margin-top:14px">${v.mr.monthLabel}</label>
  <select id="mrmonth" class="inp" value=${f.month} onChange=${v.mr.setMonth}>${v.mr.opts.map(opt)}</select>
  ${v.mr.exception ? html`<div>
    <label class="lbl" for="mrfile" style="margin-top:14px">Approval document (Mail or PDF, up to 10 MB) – mandatory</label>
    <input id="mrfile" type="file" accept=".pdf,.eml,.msg" onChange=${v.mr.setFile} style="font-size:14px" />
    ${v.mr.hasFile ? html`<div style="font-size:13px;margin-top:6px;color:#1B5E20">Attached: ${f.file}</div>` : null}
    <div class="muted" style="font-size:12px;margin-top:6px">Allowed up to M+12. Going beyond MOU validity needs explicit business authorisation.</div>
  </div>` : null}
  <div class="muted" style="font-size:12px;margin-top:12px">${v.mr.flowNote}</div>
  ${v.mr.hasErr ? html`<div class="err" role="alert">${f.err}</div>` : null}
  ${mFoot('Submit Request', v.mr.submit)}
</div>`) : null}

${v.mApprove ? overlay('mapt', 520, html`<div>
  ${mHead('mapt', v.ma.title)}
  <div style="background:#F5F7FA;border-radius:6px;padding:12px 14px;margin:16px 0;font-size:13px">
    ${v.ma.lines.map(function (l) { return html`<div key=${l} class="ln">${l}</div>`; })}
  </div>
  ${v.ma.needSc ? html`<div><label class="lbl" for="masc">Service Charge (USD/MT) – mandatory</label><input id="masc" class="inp" inputMode="decimal" value=${f.sc || ''} onChange=${v.ma.setSc} /></div>` : null}
  ${v.ma.needBw ? html`<div><label class="lbl" for="mabw">${v.ma.bwLabel}</label><input id="mabw" class="inp" inputMode="decimal" value=${f.bw || ''} onChange=${v.ma.setBw} placeholder="e.g. 3.125" /></div>` : null}
  ${v.ma.needPrem ? html`<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px">
    <div><label class="lbl" for="maeff">Effective Date – mandatory</label><input id="maeff" type="date" class="inp" value=${f.eff || ''} onChange=${v.ma.setEff} /></div>
    <div><label class="lbl" for="maprem">Additional Premium</label><input id="maprem" class="inp" inputMode="decimal" value=${f.prem == null ? '' : f.prem} onChange=${v.ma.setPrem} /></div>
  </div>` : null}
  ${v.ma.plain ? html`<p style="margin:0;font-size:15px">${v.ma.question}</p>` : null}
  ${v.ma.hasErr ? html`<div class="err" role="alert">${f.err}</div>` : null}
  ${mFoot(v.ma.cta, v.ma.submit)}
</div>`) : null}

${v.mReject ? overlay('mrjt', 480, html`<div>
  ${mHead('mrjt', v.mj.title)}
  <p class="muted" style="font-size:13px">${v.mj.note}</p>
  <label class="lbl" for="mjr">Reason – mandatory</label>
  <textarea id="mjr" class="inp" style="height:90px;padding:10px" value=${f.reason || ''} onChange=${v.mj.setReason}></textarea>
  ${v.mj.hasErr ? html`<div class="err" role="alert">${f.err}</div>` : null}
  ${mFoot(v.mj.cta, v.mj.submit, true)}
</div>`) : null}

${v.mManual ? overlay('mmt', 560, html`<div>
  ${mHead('mmt', 'Manual pricing (HZL direct)')}
  <p class="muted" style="font-size:13px">Maker–checker: ASM enters the details and CSA approves. Once approved, the entry shows as Approved to the customer and follows the existing CDT and pricing reconciliation flow.</p>
  <label class="lbl" for="mmpo">Planned Order</label>
  <select id="mmpo" class="inp" value=${f.po || ''} onChange=${v.mm.setPo}><option value="">Select a planned order</option>${v.mm.poOpts.map(opt)}</select>
  <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px">
    <div><label class="lbl" for="mmq">Quantity (MT)</label><input id="mmq" class="inp" inputMode="decimal" value=${f.qty || ''} onChange=${v.mm.setQty} /></div>
    <div><label class="lbl" for="mmt2">Price Type</label><select id="mmt2" class="inp" value=${f.type} onChange=${v.mm.setType}>${v.mm.typeOpts.map(opt)}</select></div>
    <div><label class="lbl" for="mml">LME Price (USD/MT)</label><input id="mml" class="inp" inputMode="decimal" value=${f.lme || ''} onChange=${v.mm.setLme} /></div>
    <div><label class="lbl" for="mmd">Booking date</label><input id="mmd" type="date" class="inp" min="2026-11-01" max="2026-11-11" value=${f.date || ''} onChange=${v.mm.setDate} /></div>
    <div><label class="lbl" for="mmtm">Booking time</label><input id="mmtm" type="time" class="inp" value=${f.time || ''} onChange=${v.mm.setTime} /></div>
  </div>
  <div class="muted" style="font-size:12px;margin-top:8px">Backdating is allowed within the current month only. Quantity cannot exceed the plan's balance unpriced quantity.</div>
  ${v.mm.hasErr ? html`<div class="err" role="alert">${f.err}</div>` : null}
  ${mFoot('Send to CSA', v.mm.submit)}
</div>`) : null}

<div class="wm" aria-hidden="true"></div>
</div>`;
};

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body></html>
