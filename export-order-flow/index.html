<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Export Order Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap">
<style>
/* Single light theme on purpose: mirrors the client's light enterprise UI, like the other VMB prototypes.
   Layout: labelled sidebar + slim top bar + work area; order screens pair a working column with a sticky summary panel. */
:root{
  color-scheme:light;
  --blue:#0A5DA8; --blue-700:#084A86; --blue-50:#EAF2FB; --blue-100:#D3E4F6;
  --green:#6CB33F; --green-700:#4B8A26; --green-50:#EEF7E8;
  --ink:#14202E; --ink-2:#475467; --ink-3:#5F6B7A;
  --bg:#F4F6F9; --surface:#FFFFFF; --line:#E3E8EF; --line-2:#EEF1F5;
  --ok:#067647; --ok-50:#DCFAE6; --amber:#B54708; --amber-50:#FEF0C7; --red:#B42318; --red-50:#FEE4E2;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 16px 40px -12px rgba(11,37,69,.28);
  --f:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:13px;letter-spacing:-.01em}
.muted{color:var(--ink-3)}
.eyebrow{font-size:11.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}

/* ---- motion (shared with Product KYC) ---- */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes logoPulse{0%,100%{transform:scale(.92);opacity:.85}50%{transform:scale(1);opacity:1}}
@keyframes toastSlideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes modalPopIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes drawerIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes backdropFadeIn{from{opacity:0}to{opacity:1}}
@keyframes rowFlash{from{background:var(--green-50)}to{background:transparent}}

/* ---- page loader (from Product KYC) ---- */
.page-loader{position:fixed;inset:0;z-index:250;background:rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#3C4652;font-size:13px;font-weight:500}
.page-loader.solid{background:#FFFFFF}
.page-loader .loader-label{background:#FFFFFF;padding:3px 12px;border-radius:12px;box-shadow:0 2px 8px rgba(16,24,40,.12)}
.page-loader .loader-mark{position:relative;width:84px;height:84px;display:flex;align-items:center;justify-content:center;background:#FFFFFF;border-radius:50%;box-shadow:0 8px 24px -6px rgba(16,24,40,.28)}
.page-loader .loader-mark img{width:52px;height:52px;animation:logoPulse 1.1s ease-in-out infinite}
.page-loader .loader-mark::before{content:"";position:absolute;inset:4px;border-radius:50%;border:3px solid #E3ECF6;border-top-color:var(--blue);border-right-color:var(--green);animation:spin .9s linear infinite}
@media (prefers-reduced-motion:reduce){.page-loader .loader-mark img{animation:none}.page-loader .loader-mark::before{animation-duration:2s}}

/* ---- primitives ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid transparent;font-weight:500;background:none;white-space:nowrap;transition:background .14s,border-color .14s,box-shadow .14s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-700)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:var(--green-700)}
.btn-outline{border-color:var(--line);background:var(--surface)}.btn-outline:hover{border-color:var(--blue);color:var(--blue)}
.btn-soft{background:var(--blue-50);color:var(--blue)}.btn-soft:hover{background:var(--blue-100)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger-soft{background:var(--red-50);color:var(--red)}
.btn-ok-soft{background:var(--ok-50);color:var(--ok)}
.btn-sm{min-height:32px;padding:0 12px;font-size:13px;border-radius:6px}
.btn-lg{min-height:48px;font-size:15px}
.btn-block{width:100%}
.btn[disabled]{background:var(--line-2);color:#98A2B3;border-color:var(--line-2);cursor:not-allowed}
.icon-btn{width:40px;height:40px;border-radius:8px;border:0;background:none;display:inline-grid;place-items:center;color:var(--ink-2);position:relative}
.icon-btn:hover{background:var(--line-2);color:var(--ink)}
.icon-btn.sm{width:32px;height:32px;border-radius:6px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:13px;font-weight:500;color:var(--ink-2)}
.input{height:40px;width:100%;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:#fff;transition:border-color .14s,box-shadow .14s}
.input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}
.input.err{border-color:var(--red);box-shadow:0 0 0 3px var(--red-50)}
textarea.input{height:auto;min-height:88px;padding:10px 12px;resize:vertical}
.hint{font-size:12px;color:var(--ink-3)}
.err-text{font-size:12.5px;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h h3{font-size:15px;font-weight:700}
.card-b{padding:20px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
.p-created{background:var(--blue-50);color:var(--blue)}
.p-asm{background:var(--amber-50);color:var(--amber)}
.p-ok{background:var(--ok-50);color:var(--ok)}
.p-rej{background:var(--red-50);color:var(--red)}
.p-gray{background:var(--line-2);color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:5px;font-size:11.5px;font-weight:500;background:var(--line-2);color:var(--ink-2)}
.tag.zinc{background:var(--blue-50);color:var(--blue)}
.tag.lead{background:var(--green-50);color:var(--green-700)}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:#fff;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-50);color:var(--blue)}
.seg{display:inline-flex;padding:3px;background:var(--line-2);border-radius:9px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:7px;font-weight:500;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--blue);box-shadow:var(--shadow)}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:8px;font-size:13.5px;background:var(--blue-50);color:var(--blue-700)}
.notice.warn{background:var(--amber-50);color:var(--amber)}
.notice.bad{background:var(--red-50);color:var(--red)}
.notice.ok{background:var(--ok-50);color:var(--ok)}
.empty{padding:56px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--ink-3)}
.empty b{color:var(--ink);font-size:16px}
.empty .ill{width:56px;height:56px;border-radius:14px;background:var(--blue-50);color:var(--blue);display:grid;place-items:center}

/* ---- login ---- */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:#fff}
.auth-brand{position:relative;overflow:hidden;background:var(--blue);color:#fff;padding-block:40px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:40px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.auth-brand::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 110% 0%,rgba(108,179,63,.55) 0,rgba(108,179,63,0) 45%),
  repeating-radial-gradient(circle at -10% 110%,rgba(255,255,255,.07) 0 2px,transparent 2px 34px)}
.auth-brand>*{position:relative}
.brand-row{display:flex;align-items:center;gap:12px}
.brand-row .mark{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center}
.brand-row .mark img{width:32px;height:32px}
.brand-row b{font-size:22px;letter-spacing:-.01em}
.brand-row span{display:block;font-size:12px;opacity:.8;font-weight:400}
.auth-pitch h1{font-size:clamp(30px,3.4vw,44px);line-height:1.1;font-weight:700;max-width:14ch}
.auth-pitch h1 em{font-style:normal;color:#BFE6A3}
.auth-pitch p{font-size:16px;opacity:.88;max-width:42ch;margin:14px 0 0}
.flowline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:560px}
.flowline div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:12px;font-size:13px}
.flowline b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-bottom:4px;font-weight:500}
.auth-form{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.auth-form form{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px}
.auth-form h2{font-size:24px;font-weight:700}
.auth-form .sub{color:var(--ink-3);margin-top:4px}
.roles{display:grid;gap:8px}
.role-card{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.role-card:hover{border-color:var(--blue);background:var(--blue-50)}
.role-card .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.role-card b{display:block;font-size:14px}.role-card small{color:var(--ink-3);font-size:12.5px}
.role-card .go{margin-left:auto;color:var(--blue)}
.divider{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:12px}.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.alt-links{display:flex;gap:10px;flex-wrap:wrap}.alt-links .btn{flex:1}

/* ---- app shell ---- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));gap:6px;overflow-y:auto;z-index:30}
.side .brand-row{padding:4px 8px 14px;color:var(--ink)}
.side .brand-row .mark{width:36px;height:36px;background:var(--blue-50)}.side .brand-row .mark img{width:26px;height:26px}
.side .brand-row b{font-size:18px;color:var(--blue)}.side .brand-row span{color:var(--green-700);font-weight:500;opacity:1;font-size:11px}
.nav-g{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#98A2B3;padding:14px 10px 6px}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 10px;border-radius:8px;border:0;background:none;color:var(--ink-2);font-weight:500;text-align:left}
.nav-i:hover{background:var(--line-2);color:var(--ink)}
.nav-i[aria-current="page"]{background:var(--blue-50);color:var(--blue)}
.nav-i .cnt{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:var(--blue);color:#fff;font-size:11.5px;display:grid;place-items:center}
.nav-i .cnt.g{background:var(--green)}
.nav-i .soon{margin-left:auto;font-size:10.5px;color:#98A2B3;font-weight:500}
.nav-i[disabled]{cursor:default;opacity:.6}.nav-i[disabled]:hover{background:none;color:var(--ink-2)}
.me{margin-top:auto;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.me-row{display:flex;gap:10px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.av-customer{background:var(--blue-50);color:var(--blue)}.av-asm{background:var(--amber-50);color:var(--amber)}.av-rm{background:var(--green-50);color:var(--green-700)}
.me b{font-size:13.5px;display:block}.me small{font-size:12px;color:var(--ink-3)}
.me .switch{display:flex;gap:6px;flex-wrap:wrap}
.me .switch button{flex:1;height:30px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12px;font-weight:500;color:var(--ink-2)}
.me .switch button:hover{border-color:var(--blue);color:var(--blue)}
.me .links{display:flex;justify-content:space-between;font-size:12.5px}
.linkbtn{border:0;background:none;padding:0;color:var(--blue);font-weight:500}
.linkbtn.red{color:var(--red)}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(244,246,249,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:14px;padding-block:14px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.topbar .menu-btn{display:none}
.gsearch{position:relative;flex:1 1 260px;max-width:420px}
.gsearch input{height:40px;width:100%;border:1px solid var(--line);border-radius:20px;padding:0 16px 0 40px;background:#fff}
.gsearch input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}
.gsearch svg{position:absolute;left:14px;top:11px;color:var(--ink-3)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.market{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#fff;font-size:13px}
.market select{border:0;background:none;font-weight:500;padding:0;max-width:170px}
.market select:focus{outline:none}
.dot-badge{position:absolute;top:4px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.dot-badge.g{background:var(--green)}
.proto-tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);background:var(--amber-50);padding:4px 8px;border-radius:5px}
.pop{position:absolute;right:0;top:48px;width:340px;max-width:calc(100vw - 32px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);z-index:60;animation:modalPopIn .16s ease-out}
.pop-h{padding:14px 16px;border-bottom:1px solid var(--line-2);font-weight:700;display:flex;justify-content:space-between}
.pop-list{max-height:360px;overflow-y:auto}
.ntf{padding:12px 16px;border-bottom:1px solid var(--line-2);font-size:13px;display:flex;gap:10px}
.ntf:last-child{border-bottom:0}
.ntf i{width:8px;height:8px;border-radius:50%;background:var(--line);margin-top:6px;flex:none}
.ntf.unread i{background:var(--blue)}
.ntf small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}

.content{padding-block:8px 56px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0}
.page{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.page-head p{margin:4px 0 0;color:var(--ink-3)}
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-3);margin-bottom:6px;flex-wrap:wrap}
.crumbs button{border:0;background:none;padding:0;color:var(--blue);font-weight:500}

/* ---- catalog ---- */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.pcard{display:flex;flex-direction:column;overflow:hidden;transition:transform .14s,box-shadow .14s,border-color .14s}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--blue-100)}
.pcard .art{aspect-ratio:16/11;background:linear-gradient(180deg,#F7F9FB,#EDF1F5);display:grid;place-items:center;border-bottom:1px solid var(--line-2);max-width:100%}
.pcard .art svg{width:78%;height:auto}
.pcard .body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.pcard h3{font-size:17px;font-weight:700}
.pcard .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pcard .desc{font-size:12.5px;color:var(--ink-3);flex:1}
@media (prefers-reduced-motion:reduce){.pcard,.pcard:hover{transition:none;transform:none}}

/* ---- PDP ---- */
.pdp{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:20px;align-items:start}
.gallery{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.gallery .art{background:linear-gradient(180deg,#F7F9FB,#EDF1F5);display:grid;place-items:center;aspect-ratio:1/1;border-right:1px solid var(--line-2);border-radius:12px 0 0 12px;max-width:100%}
.gallery .art svg{width:80%}
.gallery .info{padding:24px;display:flex;flex-direction:column;gap:14px}
.gallery .info h2{font-size:26px;font-weight:700}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 20px}
.kv div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv span{font-size:12px;color:var(--ink-3)}
.kv b{font-weight:500;overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:14px 12px;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
.spec{width:100%;border-collapse:collapse}
.spec td{padding:12px 0;border-bottom:1px solid var(--line-2)}
.spec tr:last-child td{border-bottom:0}
.spec td:first-child{color:var(--ink-3);width:40%}
.spec td:last-child{font-weight:500}
.order-panel{position:sticky;top:84px}
.order-panel .card-b{display:flex;flex-direction:column;gap:18px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;height:44px}
.stepper button{width:44px;height:100%;border:0;background:var(--line-2);font-size:18px;color:var(--ink)}
.stepper button:hover{background:var(--blue-50);color:var(--blue)}
.stepper input{width:90px;height:100%;border:0;text-align:center;font-weight:700;font-size:16px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{outline:none;background:var(--blue-50)}
.stepper .unit{padding:0 12px;color:var(--ink-3);font-size:13px;border-left:1px solid var(--line);height:100%;display:grid;place-items:center;background:#fff}
.stepper.sm{height:40px}.stepper.sm button{width:36px}.stepper.sm input{width:70px;font-size:14px}
.months{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.months button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.months button b{font-size:15px}.months button small{font-size:11.5px;color:var(--ink-3)}
.months button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-50);color:var(--blue)}
.months button[aria-pressed="true"] small{color:var(--blue)}
.summary-line{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--bg);border-radius:8px;font-size:13px}
.summary-line b{font-size:15px}
.btn-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}

/* ---- planner (cart) ---- */
.steps{display:flex;gap:0;align-items:center;flex-wrap:wrap;row-gap:8px}
.steps .s{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink-3)}
.steps .s i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:var(--line);color:var(--ink-2)}
.steps .s.done i{background:var(--green);color:#fff}.steps .s.cur{color:var(--ink)}.steps .s.cur i{background:var(--blue);color:#fff}
.steps .bar{width:40px;height:2px;background:var(--line);margin:0 10px}
.steps .bar.done{background:var(--green)}
.planner{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.citem .card-h{gap:16px}
.citem .thumb{width:64px;height:64px;border-radius:10px;background:linear-gradient(180deg,#F7F9FB,#EDF1F5);display:grid;place-items:center;flex:none;border:1px solid var(--line-2)}
.citem .thumb svg{width:54px}
.citem .ttl{display:flex;gap:14px;align-items:center;min-width:0;flex:1}
.citem .ttl h3{font-size:16px}
.ctrls{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:end}
.split{margin-top:20px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.split-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:var(--bg);flex-wrap:wrap}
.split-h h4{font-size:14px;font-weight:700}
.alloc{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:500}
.alloc .track{width:140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.alloc .fill{height:100%;background:var(--green);border-radius:3px;transition:width .2s}
.alloc.under .fill{background:#F79009}.alloc.over .fill{background:var(--red)}
.alloc.under{color:var(--amber)}.alloc.over{color:var(--red)}.alloc.full{color:var(--ok)}
.prow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,.8fr) 36px;gap:12px;align-items:end;padding:14px 16px;border-top:1px solid var(--line-2)}
.prow .icon-btn{width:36px;height:40px}
.split-f{padding:12px 16px;border-top:1px solid var(--line-2)}
.sum-card{position:sticky;top:84px}
.sum-row{display:flex;justify-content:space-between;align-items:baseline;padding:14px 20px;border-bottom:1px solid var(--line-2)}
.sum-row span{color:var(--ink-2)}.sum-row b{font-size:18px}
.route{display:flex;flex-direction:column;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.route-line{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;flex-wrap:wrap}
.route-line span{display:inline-flex;align-items:center;gap:6px}
.route-line em{font-style:normal;color:#98A2B3}

/* ---- orders ---- */
.subnav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.subnav .tabs{border-bottom:0;padding:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);position:relative}
.stat:hover{border-color:var(--blue-100)}
.stat[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}
.stat .lbl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);font-weight:500}
.stat .lbl i{width:8px;height:8px;border-radius:50%}
.stat b{font-size:26px;font-weight:700;line-height:1}
.stat small{font-size:12px;color:var(--ink-3)}
.stat .mine{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--blue);color:#fff;padding:2px 7px;border-radius:4px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.toolbar .input{width:auto;min-width:180px;height:36px;font-size:13px}
.toolbar .search-in{position:relative;flex:1 1 220px;max-width:320px}
.toolbar .search-in .input{width:100%;padding-left:34px}
.toolbar .search-in svg{position:absolute;left:11px;top:10px;color:var(--ink-3)}
.toolbar .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:1080px}
.tbl th{text-align:left;font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);padding:12px 16px;background:#FAFBFC;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:16px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#FAFBFD}
.tbl tr.flash td{animation:rowFlash 2.6s ease-out}
@media (prefers-reduced-motion:reduce){.tbl tr.flash td{animation:none;background:var(--green-50)}}
.cell{display:flex;flex-direction:column;gap:4px}
.cell .sub{font-size:12.5px;color:var(--ink-3)}
.idbtn{border:0;background:none;padding:0;color:var(--blue);font-family:var(--mono);font-weight:500;font-size:13.5px;text-align:left}
.idbtn:hover{text-decoration:underline}
.new{font-size:10px;font-weight:700;letter-spacing:.05em;background:var(--green);color:#fff;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:2px;font-family:var(--f)}
.ptchips{display:flex;flex-direction:column;gap:4px}
.ptchip{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.ptchip b{font-weight:500}
.ptchip em{font-style:normal;color:var(--ink-3);font-size:12.5px}
.qty-grid{display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:13px}
.qty-grid span{color:var(--ink-3)}
.qty-grid b{font-weight:500;text-align:right}
.dbar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line-2);margin-top:6px;overflow:hidden}
.dbar i{display:block;height:100%;background:var(--green)}
.track3{display:flex;align-items:center;gap:0;margin-bottom:8px}
.track3 i{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.track3 u{width:26px;height:2px;background:var(--line);text-decoration:none}
.track3 .d{background:var(--green)}.track3 .c{background:#F79009;box-shadow:0 0 0 3px var(--amber-50)}.track3 .r{background:var(--red)}
.track3 u.d{background:var(--green)}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.foot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line-2);font-size:13px;color:var(--ink-3);flex-wrap:wrap;gap:8px}
.pager{display:flex;gap:4px}.pager button{width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:13px}
.pager button[aria-current="page"]{background:var(--blue);border-color:var(--blue);color:#fff}
.monthnav{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:20px;padding:3px;background:#fff}
.monthnav button{width:30px;height:30px;border-radius:50%;border:0;background:none;color:var(--blue);font-size:16px}
.monthnav button:hover{background:var(--blue-50)}
.monthnav button[disabled]{color:#C0C7D0;background:none;cursor:default}
.monthnav b{min-width:84px;text-align:center;font-size:14px}
.subrow td{background:#FAFBFC}
.subrow .kv{padding:4px 0}

/* ---- overlays ---- */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(16,24,40,.45);animation:backdropFadeIn .16s ease-out}
.modal-wrap{position:fixed;inset:0;z-index:101;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding-block:max(48px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.modal{pointer-events:auto;width:100%;max-width:560px;background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);animation:modalPopIn .18s ease-out}
.modal.wide{max-width:760px}
.m-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px 0}
.m-h h2{font-size:18px}
.m-h p{margin:4px 0 0;color:var(--ink-3);font-size:13px}
.m-b{padding:18px 22px;display:flex;flex-direction:column;gap:16px}
.m-f{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:101;width:min(560px,100vw);background:#fff;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:drawerIn .2s ease-out;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.d-h{padding:20px 24px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.d-h h2{font-family:var(--mono);font-size:18px;font-weight:500}
.d-b{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:22px}
.d-f{padding:14px 24px;border-top:1px solid var(--line-2);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.sec-t{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;position:relative;padding-bottom:18px}
.tl:last-child{padding-bottom:0}
.tl::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl.done::before{background:var(--green)}
.tl .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line-2);color:var(--ink-3);border:2px solid var(--line);z-index:1}
.tl.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.tl.cur .dot{background:var(--amber-50);border-color:#F79009;color:var(--amber)}
.tl.rej .dot{background:var(--red);border-color:var(--red);color:#fff}
.tl b{display:block;font-size:14px}.tl small{color:var(--ink-3);font-size:12.5px}
.tl .rm{margin-top:6px;font-size:13px;background:var(--bg);border-radius:6px;padding:8px 10px}
.mini{width:100%;border-collapse:collapse;font-size:13px}
.mini th{text-align:left;font-weight:500;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px}
.mini td{padding:10px;border-bottom:1px solid var(--line-2)}
.log{display:flex;flex-direction:column;gap:8px;font-size:13px}
.log div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px}
.log time{color:var(--ink-3)}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:300;display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-left:0;border-radius:10px;padding:14px 18px 14px 14px;box-shadow:var(--shadow-lg);max-width:min(420px,calc(100vw - 40px));animation:toastSlideIn .2s ease-out;font-weight:500}
.toast .ti{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--ok-50);color:var(--ok)}
.toast.info .ti{background:var(--blue-50);color:var(--blue)}

/* ---- responsive ---- */
@media (max-width:1180px){.pdp{grid-template-columns:minmax(0,1fr)}.order-panel{position:static}.planner{grid-template-columns:minmax(0,1fr)}.sum-card{position:static}}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-lg)}
  .side.open{transform:none}
  .topbar .menu-btn{display:inline-grid}
  .topbar,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .auth{grid-template-columns:minmax(0,1fr)}
  .auth-brand{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
  .flowline{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gallery{grid-template-columns:minmax(0,1fr)}.gallery .art{border-right:0;border-bottom:1px solid var(--line-2);border-radius:12px 12px 0 0;aspect-ratio:16/10}
}
@media (max-width:600px){
  .market,.proto-tag{display:none}
  .ctrls{grid-template-columns:minmax(0,1fr)}
  .prow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px}.prow .field:nth-child(3){grid-column:1/3}
  .months{grid-template-columns:repeat(2,minmax(0,1fr))}
  .btn-pair{grid-template-columns:minmax(0,1fr)}
  .log div{grid-template-columns:minmax(0,1fr)}
}
</style>

function hist(status,created){
  const h=[{at:created,by:'Customer',action:'Created'}];
  const t=d=>new Date(new Date(created).getTime()+d*3600e3).toISOString();

  if(status==='approved')h.push({at:t(20),by:'RM',action:'Approved',remark:''});
  return h;
}

/* generic ingot illustrations */
function ingot(kind){
  const st='stroke="#5E666E" stroke-width="1"';
  if(kind==='jumbo')return `<svg viewBox="0 0 220 170" aria-hidden="true">
    <polygon points="40,95 140,70 190,92 90,118" fill="#C9CFD5" ${st}/><polygon points="40,95 90,118 90,155 40,132" fill="#8F979F" ${st}/><polygon points="90,118 190,92 190,128 90,155" fill="#A9B0B7" ${st}/>
    <polygon points="55,55 140,35 180,52 95,73" fill="#D3D8DD" ${st}/><polygon points="55,55 95,73 95,100 55,82" fill="#959DA5" ${st}/><polygon points="95,73 180,52 180,78 95,100" fill="#B1B7BE" ${st}/>
    <ellipse cx="118" cy="52" rx="7" ry="3" fill="#8F979F"/><ellipse cx="150" cy="47" rx="7" ry="3" fill="#8F979F"/></svg>`;
  if(kind==='cross'){let g='';[[60,60,-30],[100,40,-30],[140,62,-30],[80,95,60],[120,80,60],[100,118,-30],[140,100,60],[60,100,60]].forEach(([x,y,r])=>{g+=`<g transform="translate(${x} ${y}) rotate(${r})"><rect x="-28" y="-10" width="56" height="20" rx="4" fill="#A3ABB3" ${st}/><rect x="-24" y="-7" width="48" height="8" rx="3" fill="#C8CED4"/></g>`});return `<svg viewBox="0 0 220 170" aria-hidden="true">${g}</svg>`}
  let bars='';for(let i=0;i<6;i++){const y=60+i*15;bars+=`<path d="M30 ${y} L100 ${y+20} L195 ${y-8}" fill="none" stroke="#6B737B" stroke-width="1.2"/>`}
  const straps=kind==='bundle'?'<path d="M45 50 L170 140 M80 40 L190 120" stroke="#2BA38A" stroke-width="4"/><path d="M30 92 L100 112 L195 84" stroke="#2BA38A" stroke-width="4" fill="none"/>':'<path d="M55 42 V140 M75 48 V146 M125 50 V146 M160 40 V136" stroke="#2BA38A" stroke-width="4"/>';
  return `<svg viewBox="0 0 220 170" aria-hidden="true"><polygon points="30,45 125,25 195,40 100,65" fill="#C3C9CF" ${st}/><polygon points="30,45 100,65 100,155 30,135" fill="#868E96" ${st}/><polygon points="100,65 195,40 195,130 100,155" fill="#A2A9B0" ${st}/>${bars}${straps}</svg>`;
}

      <div class="links"><button class="linkbtn" data-a="reset">Reset demo</button><button class="linkbtn red" data-a="logout">Log out</button></div></div>

  const pop=UI.menu==='bell'?`<div class="pop" role="dialog" aria-label="Notifications"><div class="pop-h">Notifications<span class="muted" style="font-weight:400;font-size:12.5px">${myNotes.length} total</span></div><div class="pop-list">

  return `<div class="alloc ${cls}" id="al${i}"><span class="track"><span class="fill" style="width:${pct}%"></span></span><span>${txt}</span></div>`;
}

function tracker(po){

function statusBlock(po){

function timeline(po){
  const h=po.history;const asm=h.find(x=>x.by==='ASM'&&x.action!=='Edited'),rm=h.find(x=>x.by==='RM');
  const node=(state,title,who,ev,pend)=>`<div class="tl ${state}"><span class="dot">${state==='done'?I.check:state==='rej'?I.x:state==='cur'?'•':''}</span><div><b>${title}</b><small>${ev?`${ev.action} · ${fmt(ev.at)}`:pend}</small>${ev&&ev.remark?`<div class="rm">“${esc(ev.remark)}”</div>`:''}</div></div>`;
  return `<div class="timeline">
    ${node('done','Planned by customer','',{action:'Created',at:po.created},'')}
    ${asm?node(asm.action==='Rejected'?'rej':'done','ASM review','',asm,''):node(po.status==='created'?'cur':'','ASM review','',null,po.status==='rejected'?'Not reached':'Waiting for ASM')}
    ${rm?node(rm.action==='Rejected'?'rej':'done','RM final approval','',rm,''):node(po.status==='asm'?'cur':'','RM final approval','',null,po.status==='rejected'?'Not reached':'Waiting for RM')}
  </div>`;
}

  const id=UI.drawer;if(!id)return '';const po=S.pos.find(p=>p.id===id);if(!po)return '';
  const u=S.user,can=(u==='asm'&&po.status==='created')||(u==='rm'&&po.status==='asm');
  const bks=S.bookings.filter(b=>b.dealId===po.id);
  return `<div class="scrim" data-a="dclose"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${po.id}">
    <div class="d-h"><div><div class="eyebrow">Planned order</div><h2>${po.id}</h2><div style="margin-top:8px"><span class="pill ${ST[po.status].cls}">${ST[po.status].label}</span></div></div><button class="icon-btn" aria-label="Close" data-a="dclose">${I.x}</button></div>
    <div class="d-b">
      <div><div class="sec-t">Approval</div>${timeline(po)}</div>
      <div><div class="sec-t">Order</div><div class="kv"><div><span>Product</span><b>${esc(po.variant)}</b></div><div><span>Customer</span><b>${esc(ROLES.customer.sub)}</b></div><div><span>MoU</span><b class="mono">${po.mou}</b></div><div><span>Delivery in</span><b>${po.month}</b></div><div><span>Net physical</span><b class="num">${n2(po.qty)} MT</b></div><div><span>Net pricing</span><b class="num">${n2(sum(po.rows))} MT</b></div></div></div>
      <div><div class="sec-t">Price types</div>${rowsTable(po.rows)}</div>
      ${bks.length?`<div><div class="sec-t">Price bookings</div><div class="kv">${bks.map(b=>`<div><span>${esc(b.type)} · ${b.month}</span><b class="mono">PDT ${b.ticket}</b></div>`).join('')}</div></div>`:''}
      <div><div class="sec-t">History</div><div class="log">${po.history.slice().reverse().map(x=>`<div><time class="num">${fmt(x.at)}</time><span><b>${x.by}</b> ${esc(x.action.toLowerCase())}${x.remark?` · ${esc(x.remark)}`:''}</span></div>`).join('')}</div></div>
    </div>
    <div class="d-f">${can?`<button class="btn btn-danger-soft" data-a="reject" data-id="${po.id}">${I.ban}Reject</button>${u==='asm'?`<button class="btn btn-outline" data-a="edit" data-id="${po.id}">${I.edit}Edit</button>`:''}<button class="btn btn-primary" data-a="approve" data-id="${po.id}">${I.check}${u==='rm'?'Give final approval':'Approve'}</button>`
      :u==='customer'&&po.status==='approved'?`<button class="btn btn-primary" data-a="toast" data-msg="Create Delivery will be designed in the next step" data-tone="info">${I.truck}Create delivery</button>`:`<button class="btn btn-outline" data-a="dclose">Close</button>`}</div>
  </aside>`;
}
function viewModal(){
  const m=UI.modal;if(!m)return '';const po=S.pos.find(p=>p.id===m.id);
  const close=`<button class="icon-btn" aria-label="Close" data-a="mclose">${I.x}</button>`;let inner='';
  if(m.kind==='approve'||m.kind==='reject'){
    const rej=m.kind==='reject',final=S.user==='rm';
    inner=`<div class="m-h"><div><h2>${rej?'Reject':final?'Final approval for':'Approve'} <span class="mono" style="font-size:17px">${po.id}</span></h2><p>${esc(po.variant)} · ${n0(po.qty)} MT · ${po.month}</p></div>${close}</div>
    <div class="m-b">
      ${rejected_or_note(rej,final,po)}
      <div class="field"><label for="remark">Remark${rej?'':' (optional)'}</label><textarea class="input${m.err?' err':''}" id="remark" data-remark placeholder="${rej?'Tell the customer why this order is rejected':'Add a note for the record'}">${esc(m.remark||'')}</textarea>${m.err?`<span class="err-text">${esc(m.err)}</span>`:''}</div>
    </div><div class="m-f"><button class="btn btn-outline" data-a="mclose">Cancel</button><button class="btn ${rej?'btn-danger':'btn-primary'}" data-a="mconfirm">${rej?'Reject order':final?'Give final approval':'Approve and send to RM'}</button></div>`;
  }
  if(m.kind==='edit'){
    const d=m.draft,a=sum(d.rows),q=+d.qty||0,cls=a===q?'full':a>q?'over':'under';
    inner=`<div class="m-h"><div><h2>Edit <span class="mono" style="font-size:17px">${po.id}</span></h2><p>${esc(po.variant)} · MoU ${po.mou}</p></div>${close}</div>
    <div class="m-b">
      <div style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:end">
        <div class="field"><label for="e-qty">Quantity</label><div class="stepper sm"><input id="e-qty" class="num" type="number" min="1" value="${d.qty}" data-edit="qty"><span class="unit">MT</span></div></div>
        <div class="field"><label for="e-month">Delivery in</label><select class="input" id="e-month" data-edit="month">${opt(MONTHS.includes(d.month)?MONTHS:[d.month,...MONTHS],d.month)}</select></div></div>
      <div class="split" style="margin-top:0"><div class="split-h"><h4>Price types</h4><div class="alloc ${cls}"><span class="track"><span class="fill" style="width:${q?Math.min(100,a/q*100):0}%"></span></span><span>${n0(a)} of ${n0(q)} MT</span></div></div>
        ${d.rows.map((r,j)=>`<div class="prow">
          <div class="field"><label for="et${j}">Price type</label><select class="input" id="et${j}" data-erow="type" data-j="${j}">${opt(PRICE_TYPES,r.type,'Select price type')}</select></div>
          <div class="field"><label for="em${j}">Price in</label><select class="input" id="em${j}" data-erow="month" data-j="${j}">${opt(MONTHS.includes(r.month)?MONTHS:[r.month,...MONTHS],r.month)}</select></div>
          <div class="field"><label for="eq${j}">Qty (MT)</label><input class="input num" id="eq${j}" type="number" min="0" value="${r.qty}" data-erow="qty" data-j="${j}"></div>
          ${j?`<button class="icon-btn" aria-label="Remove row" data-a="erdel" data-j="${j}">${I.x}</button>`:'<span></span>'}</div>`).join('')}
        <div class="split-f"><button class="btn btn-soft btn-sm" data-a="eradd" ${d.rows.length>=PRICE_TYPES.length?'disabled':''}>${I.plus}Add price type</button></div></div>
      ${m.err?`<div class="notice bad" role="alert">${I.info}<span>${esc(m.err)}</span></div>`:''}
      <span class="hint">The customer is notified of every change you save.</span>
    </div><div class="m-f"><button class="btn btn-outline" data-a="mclose">Cancel</button><button class="btn btn-primary" data-a="esave">Save changes</button></div>`;
  }
  return `<div class="scrim" style="z-index:110" data-a="mclose"></div><div class="modal-wrap" style="z-index:111"><div class="modal${m.kind==='edit'?' wide':''}" role="dialog" aria-modal="true">${inner}</div></div>`;
}
function rejected_or_note(rej,final,po){
  if(rej)return `<div class="notice warn">${I.info}<span>The customer sees this order as Rejected, along with your remark.</span></div>`;
  return final?`<div class="notice ok">${I.check}<span>This is the final approval. The order becomes Approved, the customer can create a delivery, and ${po.rows.length} price booking ${po.rows.length>1?'entries are':'entry is'} created.</span></div>`
    :`<div class="notice">${I.info}<span>After you approve, the order goes to the RM for final approval.</span></div>`;
}

/* ---------- render ---------- */
function render(){
  const app=document.getElementById('app');let html;
  if(!S.user)html=viewLogin();
  else{const r=UI.route;
    const c=r==='catalog'?viewCatalog():r==='pdp'?viewPDP():r==='cart'?viewCart():r==='po'?viewPO():r==='pb'?viewPB():viewSoon();
    html=shell(c)+viewDrawer()+viewModal();}
  if(UI.loading)html+=loaderHTML();
  if(UI.toast)html+=`<div class="toast ${UI.toast.tone}" role="status"><span class="ti">${UI.toast.tone==='info'?I.info:I.check}</span><span>${esc(UI.toast.msg)}</span></div>`;
  app.innerHTML=html;
}
/* navigation through the Product KYC loader */
let navTimer;
function go(route,after,label){
  clearTimeout(navTimer);UI.loading=true;UI.loadingLabel=label||'Loading…';UI.menu=null;UI.side=false;render();
  navTimer=setTimeout(()=>{if(route)UI.route=route;if(after)after();UI.loading=false;UI.loadingSolid=false;render();window.scrollTo({top:0})},550);
}
function busy(label,fn){clearTimeout(navTimer);UI.loading=true;UI.loadingLabel=label;render();navTimer=setTimeout(()=>{UI.loading=false;fn();},550)}

/* ---------- actions ---------- */
function login(role){
  UI.loadingSolid=true;
  go(ROLES[role].home,()=>{S.user=role;UI.loginErr='';UI.stat=defaultStat(role);UI.search='';UI.product='';UI.drawer=null;UI.modal=null;save();
    const n=pending().length;if(role!=='customer')setTimeout(()=>toast(n?`${n} planned order${n>1?'s are':' is'} waiting for your approval`:'Your approval queue is clear','info'),0);});
}
function addToCart(){const d=UI.pdp,qty=Math.max(1,+d.qty||1);S.cart.push({pid:d.pid,variant:d.variant,mou:d.mou,qty,month:d.month,rows:[{qty,type:'',month:d.month}]});save()}
function validateCart(){
  for(const c of S.cart){const nm=P(c.pid).cartName||P(c.pid).name;
    if(!(+c.qty>0))return `Enter a quantity of at least 1 MT for ${nm}.`;
    if(c.rows.some(r=>!r.type))return `Select a price type for every row of ${nm}.`;
    if(c.rows.some(r=>!(+r.qty>0)))return `Enter a quantity for every price type row of ${nm}.`;
    if(new Set(c.rows.map(r=>r.type)).size!==c.rows.length)return `Use each price type only once for ${nm}.`;
    if(sum(c.rows)!==+c.qty)return `Price type quantities for ${nm} must add up to ${c.qty} MT.`;}
  return '';
}
function planCart(){
  const err=validateCart();UI.cartErr=err;if(err){render();return}
  busy('Creating planned order…',()=>{
    const now=new Date().toISOString(),ids=[];
    S.cart.forEach(c=>{const id='MOG1000'+(S.seq++);ids.push(id);
      S.pos.push({id,pid:c.pid,variant:c.variant,mou:c.mou,qty:+c.qty,month:c.month,rows:c.rows.map(r=>({qty:+r.qty,type:r.type,month:r.month})),status:'created',created:now,delivered:0,history:[{at:now,by:'Customer',action:'Created'}]});
      notify('asm',`New planned order ${id} from ${ROLES.customer.sub} is waiting for your approval.`,id)});
    S.cart=[];save();UI.flash={};ids.forEach(i=>UI.flash[i]=1);UI.stat='';UI.search='';UI.product='';UI.route='po';render();window.scrollTo({top:0});
    toast(ids.length>1?`${ids.length} planned orders created and sent to the ASM`:`Planned order ${ids[0]} created and sent to the ASM`);
  });
}
function decide(){
  const m=UI.modal,po=S.pos.find(p=>p.id===m.id),remark=(m.remark||'').trim(),who=S.user==='asm'?'ASM':'RM';
  if(m.kind==='reject'&&!remark){m.err='Add a remark so the customer knows why the order was rejected.';render();return}
  const label=m.kind==='reject'?'Rejecting order…':S.user==='rm'?'Approving and creating price bookings…':'Approving order…';
  UI.modal=null;
  busy(label,()=>{
    const now=new Date().toISOString();UI.flash={};UI.flash[po.id]=1;
    if(m.kind==='reject'){po.status='rejected';po.history.push({at:now,by:who,action:'Rejected',remark});notify('customer',`${po.id} was rejected by the ${who}: ${remark}`,po.id);save();render();toast(`${po.id} rejected. The customer has been notified.`,'info');return}
    if(S.user==='asm'){po.status='asm';po.history.push({at:now,by:'ASM',action:'Approved',remark});notify('rm',`${po.id} was approved by the ASM and is waiting for your final approval.`,po.id);notify('customer',`${po.id} was approved by the ASM and sent to the RM.`,po.id);save();render();toast(`${po.id} approved and sent to the RM`);return}
    po.status='approved';po.history.push({at:now,by:'RM',action:'Approved',remark});UI.newBk={};
    po.rows.forEach((r,i)=>{const t=String(1791500000000+Math.floor(Math.random()*90000000)+i);S.bookings.push({dealId:po.id,ptype:P(po.pid).type,ticket:t,apdt:'',type:r.type,qty:+r.qty,bal:+r.qty,month:toBk(r.month),created:now});UI.newBk[t]=1});
    notify('customer',`${po.id} is approved. You can now create a delivery.`,po.id);UI.bkMonth=toBk(po.rows[0].month);save();render();
    toast(`${po.id} approved. ${po.rows.length} price booking ${po.rows.length>1?'entries':'entry'} created.`);
  });
}
function saveEdit(){
  const m=UI.modal,d=m.draft,po=S.pos.find(p=>p.id===m.id);
  const fail=t=>{m.err=t;render()};
  if(!(+d.qty>0))return fail('Enter a quantity of at least 1 MT.');
  if(d.rows.some(r=>!r.type||!(+r.qty>0)))return fail('Every price type row needs a type and a quantity.');
  if(new Set(d.rows.map(r=>r.type)).size!==d.rows.length)return fail('Use each price type only once.');
  if(sum(d.rows)!==+d.qty)return fail(`Price type quantities must add up to ${d.qty} MT.`);
  const ch=[];if(+d.qty!==po.qty)ch.push(`quantity ${po.qty} → ${d.qty} MT`);if(d.month!==po.month)ch.push(`delivery ${po.month} → ${d.month}`);
  const nr=d.rows.map(r=>({qty:+r.qty,type:r.type,month:r.month}));if(JSON.stringify(nr)!==JSON.stringify(po.rows))ch.push(`price types: ${nr.map(r=>`${r.type} ${r.qty}`).join(', ')}`);
  po.qty=+d.qty;po.month=d.month;po.rows=nr;
  if(ch.length){po.history.push({at:new Date().toISOString(),by:'ASM',action:'Edited',remark:ch.join('; ')});notify('customer',`${po.id} was edited by the ASM: ${ch.join('; ')}`,po.id)}
  save();UI.modal=null;UI.drawer=po.id;render();toast(ch.length?`${po.id} updated`:'No changes to save','info');
}
function liveCart(i){
  const c=S.cart[i],el=document.getElementById('al'+i);if(el)el.outerHTML=allocHTML(c,i);
  const a=document.getElementById('sPhys'),b=document.getElementById('sPrice');
  if(a)a.textContent=n0(S.cart.reduce((x,c)=>x+(+c.qty||0),0))+' MT';
  if(b)b.textContent=n0(S.cart.reduce((x,c)=>x+sum(c.rows),0))+' MT';
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(!t){if(UI.menu){UI.menu=null;render()}return}
  const a=t.dataset.a,ds=t.dataset;if(a!=='bell')UI.menu=null;
  switch(a){
    case 'quick':login(ds.role);break;
    case 'switch':login(ds.role);break;
    case 'logout':UI.loadingSolid=true;go('login',()=>{S.user=null;UI.drawer=null;UI.modal=null;UI.loginEmail='';save()});break;
    case 'reset':{const u=S.user;go(ROLES[u].home,()=>{S=seed();S.user=u;UI.flash={};UI.newBk={};UI.stat=defaultStat(u);save()},'Resetting demo…');setTimeout(()=>toast('Demo data reset','info'),600);break}
    case 'bell':UI.menu=UI.menu==='bell'?null:'bell';render();if(UI.menu){S.notes.forEach(n=>{if(n.to===S.user)n.read=true});save()}break;
    case 'side':UI.side=!UI.side;render();break;
    case 'toast':render();toast(ds.msg,ds.tone);break;
    case 'nav':{const to=ds.to;if(to===UI.route&&!UI.side){render();break}go(to,()=>{UI.cartErr='';if(to==='po'&&S.user==='customer')UI.stat='';});break}
    case 'catf':UI.catFilter=ds.k;render();break;
    case 'buy':{const p=P(ds.id);go('pdp',()=>{UI.pdp={pid:p.id,tab:'mou',mou:MOUS[0],variant:p.variants[0],qty:1,month:MONTHS[0],spec:'spec'}});break}
    case 'pdptab':UI.pdp.tab=ds.k;render();break;
    case 'spect':UI.pdp.spec=ds.k;render();break;
    case 'pqty':UI.pdp.qty=Math.max(1,(+UI.pdp.qty||0)+(+ds.d));render();break;
    case 'pmonth':UI.pdp.month=ds.m;render();break;
    case 'addcart':addToCart();render();toast(`${P(UI.pdp.pid).name} added to cart`);break;
    case 'planpdp':addToCart();go('cart',()=>{UI.cartErr=''});setTimeout(()=>toast('Cart has been created successfully'),600);break;
    case 'cqty':{const c=S.cart[ds.i];c.qty=Math.max(1,(+c.qty||0)+(+ds.d));if(c.rows.length===1)c.rows[0].qty=c.qty;save();render();break}
    case 'cmonth':{const c=S.cart[ds.i];c.month=ds.m;c.rows.forEach(r=>{if(!r._m)r.month=ds.m});save();render();break}
    case 'cdel':{const nm=P(S.cart[ds.i].pid).name;S.cart.splice(+ds.i,1);UI.cartErr='';save();render();toast(`${nm} removed from cart`,'info');break}
    case 'radd':{const c=S.cart[ds.i],used=c.rows.map(r=>r.type);c.rows.push({qty:Math.max(0,c.qty-sum(c.rows)),type:PRICE_TYPES.find(x=>!used.includes(x))||'',month:c.month});save();render();break}
    case 'rdel':S.cart[ds.i].rows.splice(+ds.j,1);save();render();break;
    case 'plancart':planCart();break;
    case 'pricing':UI.pricing=ds.k;render();if(ds.k!=='LME')toast('INR pricing shows the same orders in this prototype','info');break;
    case 'stat':UI.stat=UI.stat===ds.k?'':ds.k;render();break;
    case 'apply':UI.search=document.getElementById('f-search').value.trim();UI.product=document.getElementById('f-prod').value;render();break;
    case 'clear':UI.search='';UI.product='';UI.stat='';render();break;
    case 'view':UI.drawer=ds.id;render();break;
    case 'dclose':UI.drawer=null;render();break;
    case 'approve':UI.modal={kind:'approve',id:ds.id,remark:''};render();setTimeout(()=>{const x=document.getElementById('remark');if(x)x.focus()},20);break;
    case 'reject':UI.modal={kind:'reject',id:ds.id,remark:''};render();setTimeout(()=>{const x=document.getElementById('remark');if(x)x.focus()},20);break;
    case 'edit':{const po=S.pos.find(p=>p.id===ds.id);UI.modal={kind:'edit',id:ds.id,draft:{qty:po.qty,month:po.month,rows:po.rows.map(r=>({...r}))}};render();break}
    case 'mclose':UI.modal=null;render();break;
    case 'mconfirm':decide();break;
    case 'eradd':{const d=UI.modal.draft,used=d.rows.map(r=>r.type);d.rows.push({qty:Math.max(0,d.qty-sum(d.rows)),type:PRICE_TYPES.find(x=>!used.includes(x))||'',month:d.month});UI.modal.err='';render();break}
    case 'erdel':UI.modal.draft.rows.splice(+ds.j,1);UI.modal.err='';render();break;
    case 'esave':saveEdit();break;
    case 'bkm':{const ms=[...new Set([...S.bookings.map(b=>b.month),...MONTHS.map(toBk)])].sort((a,b)=>bkKey(a)-bkKey(b));const i=ms.indexOf(UI.bkMonth)+(+ds.d);if(ms[i])UI.bkMonth=ms[i];render();break}
    case 'bkapply':UI.bkType=document.getElementById('bk-type').value;UI.bkProduct=document.getElementById('bk-prod').value;render();break;
    case 'bkclear':UI.bkType='';UI.bkProduct='';render();break;
    case 'bkx':UI.expanded[ds.k]=!UI.expanded[ds.k];render();break;
  }
});
document.addEventListener('submit',e=>{
  const f=e.target.dataset.form;if(!f)return;e.preventDefault();
  if(f==='login'){
    const email=document.getElementById('email').value.trim().toLowerCase(),pwd=document.getElementById('pwd').value;UI.loginEmail=email;
    const role=Object.keys(ROLES).find(k=>ROLES[k].email===email);
    if(!email||!pwd){UI.loginErr='Enter your email address and password.';render();return}
    if(!role||pwd!==PASSWORD){UI.loginErr=`That email and password don't match. Use a prototype login below, or password ${PASSWORD}.`;render();return}
    login(role);
  }
  if(f==='search'){const q=document.getElementById('gsearch').value.trim();go('po',()=>{UI.search=q;UI.stat='';UI.product=''})}
});
document.addEventListener('change',e=>{
  const t=e.target,ds=t.dataset;
  if(ds.pdp){UI.pdp[ds.pdp]=ds.pdp==='qty'?Math.max(1,+t.value||1):t.value;render();return}
  if(ds.cart==='qty'){const c=S.cart[ds.i];c.qty=Math.max(1,+t.value||1);if(c.rows.length===1)c.rows[0].qty=c.qty;UI.cartErr='';save();render();return}
  if(ds.row){const r=S.cart[ds.i].rows[ds.j];r[ds.row]=ds.row==='qty'?Math.max(0,+t.value||0):t.value;if(ds.row==='month')r._m=1;UI.cartErr='';save();render();return}
  if(ds.edit){const d=UI.modal.draft;d[ds.edit]=ds.edit==='qty'?Math.max(1,+t.value||1):t.value;if(ds.edit==='qty'&&d.rows.length===1)d.rows[0].qty=d.qty;UI.modal.err='';render();return}
  if(ds.erow){const r=UI.modal.draft.rows[ds.j];r[ds.erow]=ds.erow==='qty'?Math.max(0,+t.value||0):t.value;UI.modal.err='';render();return}
});
document.addEventListener('input',e=>{
  const t=e.target,ds=t.dataset;
  if('remark' in ds&&UI.modal){UI.modal.remark=t.value;return}
  if(ds.cart==='qty'){S.cart[ds.i].qty=+t.value||0;liveCart(+ds.i);return}
  if(ds.row==='qty'){S.cart[ds.i].rows[ds.j].qty=+t.value||0;liveCart(+ds.i);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(UI.modal||UI.drawer||UI.menu||UI.side)){if(UI.modal)UI.modal=null;else if(UI.drawer)UI.drawer=null;UI.menu=null;UI.side=false;render()}});

/* first paint uses the solid loader, like Product KYC */
UI.loading=true;UI.loadingSolid=true;render();
setTimeout(()=>{UI.loading=false;UI.loadingSolid=false;render()},550);
})();
</script>

</body></html>
