<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Product KYC Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
<style>
/* Single light theme on purpose: it mirrors the client's existing light enterprise UI. */
:root { color-scheme: light; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #F5F7FA; color-scheme: light; }
  body { font-family: 'Roboto', system-ui, sans-serif; color: #1F1F1F; -webkit-font-smoothing: antialiased; }
  #root { min-height: 100%; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #C7D1DE; border-radius: 4px; }
  button { font: inherit; }
  input, select, textarea { font: inherit; }

  .card-hover { transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease; }
  .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 22px -10px rgba(11,37,69,0.22); border-color: #1660AC !important; }
  .chip-hover { transition: transform .1s ease, box-shadow .1s ease, background-color .12s ease; }
  .chip-hover:hover { box-shadow: 0 4px 10px -4px rgba(11,37,69,0.2); }
  .row-hover { transition: background-color .12s ease; }
  .row-hover:hover { background: #F8FAFD; }
  .nav-link { transition: background-color .12s ease, color .12s ease; }
  .nav-link:hover { background: #EAF2FC; color: #0B2545 !important; }

  input:focus, select:focus, textarea:focus { outline: none; border-color: #1565C0 !important; box-shadow: 0 0 0 3px rgba(21,101,192,0.12); }
  input::placeholder, textarea::placeholder { color: #9AA0A6; }
  .icon-btn { transition: background-color .12s ease; }
  .icon-btn:hover { background: #EAF2FC !important; }
  .tab-card { transition: box-shadow .14s ease, border-color .14s ease, transform .14s ease; }
  .tab-card:hover { transform: translateY(-1px); box-shadow: 0 6px 16px -8px rgba(16,24,40,0.25); }
  .row-hover:hover { background: #F8FAFD; }
  .step-link { transition: background-color .12s ease; }
  .step-link:hover { background: #F4F7FB; }
  .pager-btn:hover:not(:disabled) { color: #1565C0; }
  .switch { position: relative; width: 38px; height: 20px; border-radius: 10px; background: #D0D5DD; transition: background-color .15s ease; flex-shrink: 0; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.25); transition: transform .15s ease; }
  .switch.on { background: #1565C0; }
  .switch.on::after { transform: translateX(18px); }
  textarea.danger-ring:focus { border-color: #E5484D !important; box-shadow: 0 0 0 3px rgba(229,72,77,0.14); }

  @keyframes btnPop {
    0%   { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(22,96,172,0.35); }
    55%  { transform: scale(1.035); box-shadow: 0 0 0 7px rgba(22,96,172,0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(22,96,172,0); }
  }
  .btn-just-enabled { animation: btnPop .42s cubic-bezier(.34,1.56,.64,1); }

  @keyframes checkPop { 0% { transform: scale(0); opacity: 0; } 65% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .check-pop { animation: checkPop .24s cubic-bezier(.34,1.56,.64,1); }

  @keyframes modalPopIn { from { opacity: 0; transform: translateY(6px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes backdropFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-backdrop { animation: backdropFadeIn .15s ease; }
  .modal-pop { animation: modalPopIn .18s cubic-bezier(.2,.9,.3,1); }

  @keyframes toastSlideIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
  .toast-in { animation: toastSlideIn .22s cubic-bezier(.2,.9,.3,1); }

  @keyframes revealDown { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .reveal-down { animation: revealDown .16s ease; }

  @keyframes flashErr { 0%,100% { box-shadow: 0 0 0 0 rgba(229,72,77,0); } 40% { box-shadow: 0 0 0 4px rgba(229,72,77,0.25); } }
  .flash-err { animation: flashErr .9s ease 2; }

  /* Page loader shown while moving between screens */
  @keyframes spin { to { transform: rotate(360deg); } }
  .page-loader { position: fixed; inset: 0; z-index: 250; background: rgba(255,255,255,0.35); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #3C4652; font-size: 13px; font-weight: 500; }
  .page-loader .loader-label { background: #FFFFFF; padding: 3px 12px; border-radius: 12px; box-shadow: 0 2px 8px rgba(16,24,40,0.12); }
  @keyframes logoPulse { 0%, 100% { transform: scale(0.92); opacity: 0.85; } 50% { transform: scale(1); opacity: 1; } }
  .page-loader .loader-mark { position: relative; width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border-radius: 50%; box-shadow: 0 8px 24px -6px rgba(16,24,40,0.28); }
  .page-loader .loader-mark img { width: 52px; height: 52px; animation: logoPulse 1.1s ease-in-out infinite; }
  .page-loader .loader-mark::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; border: 3px solid #E3ECF6; border-top-color: #1565C0; border-right-color: #6EBE3C; animation: spin .9s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .page-loader .loader-mark img { animation: none; } .page-loader .loader-mark::before { animation-duration: 2s; } }

  .page-shell { padding: 16px 20px 48px; max-width: 1360px; margin: 0 auto; }
  @media (max-width: 600px) { .page-shell { padding: 14px 12px 40px; } }
  @media (max-width: 900px) {
    .responsive-split { grid-template-columns: 1fr !important; }
    .sticky-nav { position: static !important; }
  }
  @media (max-width: 620px) { .responsive-row { grid-template-columns: 1fr !important; } }
  .topbar-shell { flex-wrap: wrap; row-gap: 8px; }
  @media (max-width: 560px) { .hide-on-mobile { display: none !important; } }
  @media (max-width: 480px) { .page-shell { overflow-x: hidden; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
:focus-visible { outline: 2px solid #1565C0; outline-offset: 2px; }
</style>
</head>
