<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DO Review Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
<style>
/* Single light theme on purpose: mirrors the client's existing light enterprise UI (same as Product KYC prototype). */
:root { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #F5F7FA; }
body { font-family: 'Roboto', system-ui, sans-serif; color: #1F1F1F; -webkit-font-smoothing: antialiased; font-size: 13px; }
button, input, select, textarea { font: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #C7D1DE; border-radius: 4px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: #1565C0 !important; box-shadow: 0 0 0 3px rgba(21,101,192,0.12); }
input::placeholder, textarea::placeholder { color: #9AA0A6; }
textarea.danger-ring:focus { border-color: #D93025 !important; box-shadow: 0 0 0 3px rgba(217,48,37,0.14); }
:focus-visible { outline: 2px solid #1565C0; outline-offset: 2px; }

.row-hover { transition: background-color .12s ease; }
.row-hover:hover { background: #F8FAFD; }
.chip-hover { transition: box-shadow .1s ease, background-color .12s ease, border-color .12s ease; }
.chip-hover:hover { box-shadow: 0 4px 10px -4px rgba(11,37,69,0.2); }
.link-btn { background: none; border: none; padding: 0; cursor: pointer; color: #1565C0; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
.link-btn:hover:not(:disabled) { text-decoration: underline; }
.link-btn:disabled { color: #A9B2BD; cursor: not-allowed; }
.view-btn { transition: background-color .12s ease, box-shadow .12s ease; }
.view-btn:hover { background: #0F4F9C !important; box-shadow: 0 4px 10px -4px rgba(21,101,192,.55); }

@keyframes btnPop { 0% { transform: scale(0.95); } 55% { transform: scale(1.035); } 100% { transform: scale(1); } }
.btn-just-enabled { animation: btnPop .42s cubic-bezier(.34,1.56,.64,1); }
@keyframes modalPopIn { from { opacity: 0; transform: translateY(6px) scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes backdropFadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-backdrop { animation: backdropFadeIn .15s ease; }
.modal-pop { animation: modalPopIn .18s cubic-bezier(.2,.9,.3,1); }
@keyframes toastSlideIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
.toast-in { animation: toastSlideIn .22s cubic-bezier(.2,.9,.3,1); }
@keyframes revealDown { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.reveal-down { animation: revealDown .16s ease; }
@keyframes rowFlash { 0% { background: #FFF6C2; } 100% { background: transparent; } }
.row-flash { animation: rowFlash 2.4s ease; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
.slide-up { animation: slideUp .2s cubic-bezier(.2,.9,.3,1); }

@keyframes spin { to { transform: rotate(360deg); } }
.page-loader { position: fixed; inset: 0; z-index: 250; background: rgba(255,255,255,0.35); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #3C4652; font-size: 13px; font-weight: 500; }
.page-loader .loader-label { background: #FFFFFF; padding: 3px 12px; border-radius: 12px; box-shadow: 0 2px 8px rgba(16,24,40,0.12); }
@keyframes logoPulse { 0%, 100% { transform: scale(0.92); opacity: 0.85; } 50% { transform: scale(1); opacity: 1; } }
.page-loader .loader-mark { position: relative; width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border-radius: 50%; box-shadow: 0 8px 24px -6px rgba(16,24,40,0.28); }
.page-loader .loader-mark img { width: 52px; height: 52px; animation: logoPulse 1.1s ease-in-out infinite; }
.page-loader .loader-mark::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; border: 3px solid #E3ECF6; border-top-color: #1565C0; border-right-color: #6EBE3C; animation: spin .9s linear infinite; }

.page-shell { padding: 16px 20px 96px; max-width: 1360px; margin: 0 auto; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.detail-split { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 16px; align-items: start; }
.review-strip { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 0; }
.review-strip > div + div { border-left: 1px solid #E4E8EE; }
.filters { display: grid; grid-template-columns: 1.4fr 1fr 1.3fr 1fr 1fr 1fr 1fr; gap: 10px; }
.table-wrap { overflow-x: auto; }
.do-table { width: 100%; border-collapse: collapse; min-width: 980px; }
.do-table th { text-align: left; font-size: 12.5px; font-weight: 700; color: #1F1F1F; background: #EEF1F5; padding: 11px 12px; white-space: nowrap; }
.do-table td { vertical-align: top; padding: 14px 12px; border-top: 1px solid #E4E8EE; font-size: 12.5px; line-height: 1.75; }
.sticky-side { position: sticky; top: 72px; }

@media (max-width: 1100px) { .filters { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 960px) {
  .detail-split { grid-template-columns: 1fr; }
  .sticky-side { position: static; }
  .review-strip { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .review-strip > div { border-left: none !important; border-top: 1px solid #E4E8EE; }
}
@media (max-width: 640px) {
  .page-shell { padding: 12px 16px 110px; }
  .grid-2 { grid-template-columns: 1fr; }
  .filters { grid-template-columns: 1fr 1fr; }
  .hide-sm { display: none !important; }
  .head-actions { width: 100%; }
  .head-actions > button { flex: 1 1 calc(50% - 8px); }
}
@media (max-width: 760px) {
  .do-table { min-width: 0; }
  .do-table thead { display: none; }
  .do-table, .do-table tbody, .do-table tr, .do-table td { display: block; width: 100%; }
  .do-table tr { border-top: 1px solid #E4E8EE; padding: 10px 0; }
  .do-table td { border: none; padding: 4px 14px; line-height: 1.6; }
  .do-table td[data-l]::before { content: attr(data-l); display: block; font-size: 11px; color: #5F6B7A; font-weight: 500; }
  .do-table td.act { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; padding-top: 8px; }
  .do-table td.act > * { margin: 0 !important; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

function pricing(o) {
  const list = product(o.product).price;
  const inter = party(o.consignee).state !== PLANT_STATE;
  const igst = inter ? list * 0.05 : 0, cgst = inter ? 0 : list * 0.025, sgst = inter ? 0 : list * 0.025;

  return { list, igst, cgst, sgst, perMt, total: perMt * (Number(o.qty) || 0), inter };
}

function Button({ children, onClick, variant = "primary", disabled, icon, style, small, title }) {

  const v = { primary:{ background:C.primary, color:"#fff" }, outline:{ background:C.panel, color:C.primary, border:`1px solid ${C.primary}` },
    secondary:{ background:C.panel, color:C.ink, border:`1px solid ${C.field}` }, danger:{ background:C.panel, color:C.red, border:`1px solid ${C.red}` },
    dangerSolid:{ background:C.red, color:"#fff" }, success:{ background:C.green, color:"#fff" } }[variant];
  return html`<button disabled=${disabled} onClick=${onClick} title=${title} className=${pop ? "btn-just-enabled" : undefined}
    style=${{ display:"inline-flex", alignItems:"center", justifyContent:"center", gap:8, fontWeight:500, fontSize:small ? 12 : 13, borderRadius:4,

}

          <button className="link-btn" style=${{ fontSize:13, fontWeight:700 }} onClick=${() => flash("Export started — DeliveryOrders.xlsx (demo)", "info")}><${Icon} n="Upload" size=${15} />Export Data</button>
        </div>
      </div>
    <//>

    <${Panel} style=${{ overflow:"hidden" }}>
      <div className="table-wrap">
        <table className="do-table">
          <thead><tr><th>Customer ID / Name</th><th>Order Details</th><th>Creation Date</th><th>Quantity (MT)</th><th>Product Details</th><th>Status</th><th style=${{ width:170 }}>Action</th></tr></thead>
          <tbody>
            ${rows.length === 0 && html`<tr><td colSpan="7" style=${{ textAlign:"center", padding:"40px 12px", color:C.sub }}>No delivery orders match these filters.</td></tr>`}
            ${rows.map(o => { const p = product(o.product); const canDo = o.type === "DO" || o.status === STATUS.OK; const open = OPEN.includes(o.status);
              return html`<tr key=${o.id} className=${"row-hover" + (flashId === o.id ? " row-flash" : "")}>
                <td><button className="link-btn" style=${{ fontWeight:700, fontSize:13 }} onClick=${() => onView(o.id)}>${o.customerId}</button><div>${o.customerName}</div></td>
                <td data-l="Order Details"><div>${o.type === "PI" ? "PI No" : "DO No"}: <b style=${{ fontWeight:500 }}>${o.id}</b></div><div>SAP SO No: ${o.sapSo || "—"}</div><div>Type: ${o.type}</div><div>Sales Org: ${o.salesOrg}</div><div>Supplying Plant: ${o.plant}</div></td>
                <td data-l="Creation Date">${fmtDate(o.createdAt)}<br/>${fmtTime(o.createdAt)}</td>
                <td data-l="Quantity (MT)">${o.type} : ${Number(o.qty).toFixed(2)}</td>
                <td data-l="Product Details">${p.name}<br/>Code: ${p.code}</td>
                <td data-l="Status"><${StatusPill} status=${o.status} /></td>
                <td className="act">
                  <button className="view-btn" onClick=${() => onView(o.id)} style=${{ display:"inline-flex", alignItems:"center", gap:7, background:C.primary, color:"#fff", border:"none", borderRadius:4, padding:"6px 12px", fontSize:12.5, fontWeight:500, cursor:"pointer", marginBottom:8 }}>
                    <${Icon} n="Eye" size=${15} />View DO
                  </button>
                  <div><button className="link-btn" onClick=${() => flash(`Downloading PI_${o.id}.pdf (demo)`)}><${Icon} n="Download" size=${14} />Download PI</button></div>
                  <div><button className="link-btn" disabled=${!canDo} title=${canDo ? undefined : "Available once the PI becomes a DO"} onClick=${() => flash(`Downloading DO_${o.id}.pdf (demo)`)}><${Icon} n="Download" size=${14} />Download DO</button></div>
                </td>
              </tr>`; })}
          </tbody>
        </table>
      </div>
      <div style=${{ display:"flex", justifyContent:"flex-end", gap:16, padding:"10px 14px", borderTop:`1px solid ${C.line}`, fontSize:12, color:C.sub }}>
        <span>Showing ${rows.length ? 1 : 0} – ${rows.length} of ${rows.length}</span>
      </div>
    <//>
  </div>`;
}

/* ============================================================
   VIEW DO (detail + in-place edit)
   ============================================================ */
const ReadVal = ({ children, changed }) => html`<div style=${{ minHeight:36, padding:"8px 11px", background:changed ? C.hl : C.panelAlt, border:`1px solid ${changed ? C.hlLine : "transparent"}`, borderRadius:4, fontSize:13, lineHeight:1.4, wordBreak:"break-word" }}>${children || html`<span style=${{ color:C.grey }}>—</span>`}</div>`;

function Field({ label, req, k, editing, value, original, onChange, type = "text", options, rows }) {
  const changed = editing && String(value ?? "") !== String(original ?? "");
  const style = { ...inputStyle, ...(changed ? { background:C.hl, borderColor:C.hlLine } : {}) };
  let control;
  if (!editing) control = html`<${ReadVal}>${value}<//>`;
  else if (options) control = html`<select style=${style} value=${value} onChange=${e => onChange(k, e.target.value)}>${options.map(o => html`<option key=${o}>${o}</option>`)}</select>`;
  else if (rows) control = html`<textarea rows=${rows} maxLength="500" style=${{ ...style, resize:"vertical" }} value=${value} placeholder="Enter remarks here…" onInput=${e => onChange(k, e.target.value)} />`;
  else control = html`<input type=${type} style=${style} value=${value} onInput=${e => onChange(k, e.target.value)} />`;
  return html`<div>
    <label style=${labelStyle}>${label}${req && html`<span style=${{ color:C.red }}> *</span>`}</label>
    ${control}
    ${changed && html`<div style=${{ fontSize:11, color:"#7A6510", marginTop:4 }}>Was: ${String(original) || "—"}</div>`}
    ${rows && editing && html`<div style=${{ fontSize:11, color:C.sub, textAlign:"right", marginTop:3 }}>${(value || "").length}/500</div>`}
  </div>`;
}

const SectionHead = ({ icon, title, right }) => html`
  <div style=${{ display:"flex", alignItems:"center", gap:10, padding:"11px 16px", background:C.panelAlt, borderBottom:`1px solid ${C.line}`, borderRadius:"8px 8px 0 0" }}>
    <${Icon} n=${icon} size=${18} color=${C.primary} /><span style=${{ fontWeight:700, fontSize:14, flex:1 }}>${title}</span>${right}
  </div>`;

function DetailView({ order, startEditing, onBack, onUpdate, onClone, flash, guardRef }) {
  const [editing, setEditing] = useState(!!startEditing);
  const [d, setD] = useState(order);
  const [modal, setModal] = useState(null);
  useEffect(() => { if (!editing) setD(order); }, [order]);

  const changes = editing ? diffFields(order, d) : [];
  const dirty = changes.length > 0;
  const qtyOk = Number(d.qty) > 0 && Number(d.qty) <= 500;
  guardRef.current = dirty;

  const live = editing ? d : order;
  const pr = pricing(live), prOld = pricing(order);
  const open = OPEN.includes(order.status);
  const on = (k, v) => setD(x => ({ ...x, [k]: v }));
  const lockReason = order.status === STATUS.OK ? `Approved and synced to SAP (SO ${order.sapSo}).` : order.status === STATUS.CAN ? "This DO is cancelled." : "";

  const startEdit = () => { setD(order); setEditing(true); };
  const discard = () => { setD(order); setEditing(false); };
  const save = () => {
    const ch = diffFields(order, d);
    onUpdate({ ...d, qty:Number(d.qty), logs:[...order.logs, { ts:new Date(), by:ME, text:`Edited · ${ch.map(c => c[1]).join(", ")}` }] });
    setEditing(false); flash(`${order.id} updated — ${ch.length} field${ch.length === 1 ? "" : "s"} changed. Review and approve when ready.`, "ok");
  };
  const tryLeave = () => { if (dirty) setModal("leave"); else onBack(); };

  const doApprove = remark => {
    const so = "11004" + String(59000 + Math.floor(Math.random() * 900));
    onUpdate({ ...order, status:STATUS.OK, sapSo:so, logs:[...order.logs, { ts:new Date(), by:ME, text:`Approved · SAP SO ${so} created${remark ? ` · “${remark}”` : ""}` }] });
    setModal(null); flash(`${order.id} approved · SAP SO ${so} created`, "ok");
  };
  const doCancel = (reason, note, andClone) => {
    const cancelled = { ...order, status:STATUS.CAN, cancelReason:reason, logs:[...order.logs, { ts:new Date(), by:ME, text:`Cancelled · ${reason}${note ? ` · “${note}”` : ""}` }] };
    onUpdate(cancelled); setModal(null);
    if (andClone) onClone(cancelled, true); else flash(`${order.id} cancelled`, "danger");
  };

  const kpis = [
    ["Quantity", `${Number(live.qty || 0).toLocaleString("en-IN")} MT`, editing && String(live.qty) !== String(order.qty)],
    ["Value per MT", inr(pr.perMt), editing && pr.perMt !== prOld.perMt],
    ["Total Order Value", inr(pr.total), editing && pr.total !== prOld.total],
    ["Supplying Plant", live.plant, editing && live.plant !== order.plant],
    ["Buyer → Consignee", live.buyer === live.consignee ? "Same party" : "Different parties", editing && (live.buyer !== order.buyer || live.consignee !== order.consignee)],
  ];

  return html`<div>
    <button className="link-btn" style=${{ fontSize:12.5, marginBottom:8 }} onClick=${tryLeave}><${Icon} n="ArrowLeft" size=${15} />Back to Orders</button>
    <div style=${{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:12, flexWrap:"wrap", marginBottom:14 }}>
      <div>
        <div style=${{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
          <h1 style=${{ fontSize:22, margin:0, fontWeight:700 }}>${editing ? "Edit Order" : "Order Details"}</h1>
          <${StatusPill} status=${order.status} big />
          ${editing && html`<${Pill} bg=${C.hl} fg="#7A6510">Editing${dirty ? ` · ${changes.length} change${changes.length === 1 ? "" : "s"}` : ""}<//>`}
        </div>
        <div style=${{ fontSize:12.5, color:C.sub, marginTop:5 }}>${order.type === "PI" ? "PI No" : "DO No"} <b style=${{ color:C.ink, fontWeight:500 }}>${order.id}</b> · ${order.customerId} ${order.customerName} · Created ${fmtDT(order.createdAt)} by ${order.createdBy}</div>
      </div>
      <div className="head-actions" style=${{ display:"flex", gap:8, flexWrap:"wrap" }}>
        ${editing ? html`
          <${Button} variant="secondary" icon="X" onClick=${() => dirty ? setModal("discard") : discard()}>Discard<//>
          <${Button} icon="Check" disabled=${!qtyOk || (!dirty && !startEditing)} onClick=${dirty ? save : discard} title=${!qtyOk ? "Fix quantity first" : !dirty && !startEditing ? "No changes yet" : undefined}>${!dirty && startEditing ? "Done" : "Save changes"}<//>`
        : html`
          <${Button} variant="secondary" icon="Copy" onClick=${() => setModal("clone")}>Clone<//>
          <${Button} variant="outline" icon="Pencil" disabled=${!open} title=${lockReason || undefined} onClick=${startEdit}>Edit<//>
          <${Button} variant="dangerSolid" icon="X" disabled=${!open} title=${lockReason || undefined} onClick=${() => setModal("cancel")}>Cancel<//>
          <${Button} variant="success" icon="Check" disabled=${!open} title=${lockReason || undefined} onClick=${() => setModal("approve")}>Approve<//>`}
      </div>
    </div>

    ${!editing && order.status === STATUS.OK && html`<${Banner} tone="green" icon="CheckCircle" title=${`Approved · SAP SO ${order.sapSo}.`}>Editing and cancelling are locked. Use Clone to raise a similar order.<//>`}
    ${!editing && order.status === STATUS.CAN && html`<${Banner} tone="red" icon="XCircle" title="Cancelled.">${order.cancelReason ? `Reason: ${order.cancelReason}. ` : ""}Use Clone to raise this order again.<//>`}
    ${editing && startEditing && order.logs[0] && /^Cloned from/.test(order.logs[0].text) && html`<${Banner} tone="green" icon="Copy" title=${`${order.id} created (${order.logs[0].text}).`}>Adjust anything that differs, or press Done to keep it as is.<//>`}
    ${editing && html`<${Banner} tone="blue" icon="Pencil" title="Editing in place.">Changed fields turn yellow and the price summary recalculates live. Save, then approve.<//>`}

    <div className="detail-split">
      <div style=${{ display:"flex", flexDirection:"column", gap:16, minWidth:0 }}>
        <${Panel}>
          <${SectionHead} icon="Cart" title="Product & Quantity" />
          <div className="grid-2" style=${{ padding:16 }}>
            <${Field} label="Product" req k="product" editing=${editing} value=${live.product} original=${order.product} onChange=${on} options=${PRODUCTS.map(p => p.name)} />
            <div>
              <label style=${labelStyle}>Quantity (MT)<span style=${{ color:C.red }}> *</span></label>
              ${editing ? html`
                <div style=${{ display:"flex" }}>
                  <button aria-label="Decrease" onClick=${() => on("qty", Math.max(0, Number(d.qty) - 1))} style=${{ ...inputStyle, width:40, borderRadius:"4px 0 0 4px", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", padding:0 }}><${Icon} n="Minus" size=${15} /></button>
                  <input type="number" min="0" value=${d.qty} onInput=${e => on("qty", e.target.value)} style=${{ ...inputStyle, borderRadius:0, borderLeft:"none", borderRight:"none", textAlign:"center", ...(String(d.qty) !== String(order.qty) ? { background:C.hl } : {}), ...(!qtyOk ? { borderColor:C.red } : {}) }} />
                  <button aria-label="Increase" onClick=${() => on("qty", Number(d.qty) + 1)} style=${{ ...inputStyle, width:40, borderRadius:0, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", padding:0 }}><${Icon} n="Plus" size=${15} /></button>
                  <span style=${{ ...inputStyle, width:"auto", borderRadius:"0 4px 4px 0", borderLeft:"none", background:C.panelAlt, display:"flex", alignItems:"center" }}>MT</span>
                </div>
                <div style=${{ fontSize:11, marginTop:4, color:qtyOk ? C.sub : C.red }}>${qtyOk ? (String(d.qty) !== String(order.qty) ? `Was: ${order.qty} MT · ` : "") + "Available against plan: 500 MT" : "Enter a quantity between 1 and 500 MT"}</div>`
              : html`<${ReadVal}>${order.qty} MT<//>`}
            </div>
          </div>
        <//>

        <${Panel}>
          <${SectionHead} icon="FileText" title="Commercial Details" />
          <div className="grid-2" style=${{ padding:16 }}>
            <${Field} label="Payment Terms" req k="paymentTerms" editing=${editing} value=${live.paymentTerms} original=${order.paymentTerms} onChange=${on} options=${PAYMENT_TERMS} />
            <${Field} label="Customer Internal Ref. No. / PO No." k="poRef" editing=${editing} value=${live.poRef} original=${order.poRef} onChange=${on} />
            <${Field} label="Buyer" req k="buyer" editing=${editing} value=${live.buyer} original=${order.buyer} onChange=${on} options=${PARTIES.map(p => p.name)} />
            <${Field} label="Consignee" req k="consignee" editing=${editing} value=${live.consignee} original=${order.consignee} onChange=${on} options=${PARTIES.map(p => p.name)} />
            <${Field} label="Sales Org" req k="salesOrg" editing=${editing} value=${live.salesOrg} original=${order.salesOrg} onChange=${on} options=${SALES_ORGS} />
            <${Field} label="Supplying Plant" req k="plant" editing=${editing} value=${live.plant} original=${order.plant} onChange=${on} options=${PLANTS} />
            <${Field} label="Inco Terms" req k="incoTerms" editing=${editing} value=${live.incoTerms} original=${order.incoTerms} onChange=${on} options=${INCO} />
            <${Field} label="Transporter Type" req k="transporterType" editing=${editing} value=${live.transporterType} original=${order.transporterType} onChange=${on} options=${TRANSPORTER_TYPES} />
            <${Field} label="Transporter Name" k="transporterName" editing=${editing} value=${live.transporterName} original=${order.transporterName} onChange=${on} />
            <${Field} label="SAP Payment Term" k="sapPaymentTerm" editing=${editing} value=${live.sapPaymentTerm} original=${order.sapPaymentTerm} onChange=${on} />
            <div style=${{ gridColumn:"1 / -1" }}>
              <${Field} label="Remarks" k="remarks" editing=${editing} value=${live.remarks} original=${order.remarks} onChange=${on} rows=${3} />
            </div>
          </div>
        <//>
      </div>

      <div className="sticky-side" style=${{ display:"flex", flexDirection:"column", gap:16 }}>
        <${Panel}>
          <${SectionHead} icon="Calc" title="Price Summary" right=${html`<span style=${{ fontSize:12, color:C.sub }}>INR</span>`} />
          <div style=${{ padding:"4px 16px" }}>
            ${[["List Price", pr.list, prOld.list], ["IGST (5%)", pr.igst, prOld.igst], ["CGST (2.5%)", pr.cgst, prOld.cgst], ["SGST (2.5%)", pr.sgst, prOld.sgst], ["Value Per MT", pr.perMt, prOld.perMt]].map(([l, v, old], i) => html`
              <div key=${l} style=${{ display:"flex", justifyContent:"space-between", gap:10, padding:"10px 0", borderTop:i ? `1px solid ${C.line}` : "none", fontSize:13 }}>
                <span>${l}</span>
                <span style=${{ fontWeight:700, textAlign:"right" }}>${inr(v)}${editing && v !== old && html`<div style=${{ fontSize:11, color:"#7A6510", fontWeight:400 }}>was ${inr(old)}</div>`}</span>
              </div>`)}
            <div style=${{ fontSize:11, color:C.sub, paddingBottom:8 }}>${pr.inter ? `Inter-state supply (${PLANT_STATE} → ${party(live.consignee).state}) · IGST applies` : `Intra-state supply (${PLANT_STATE}) · CGST + SGST apply`}</div>
          </div>
          <div style=${{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:10, padding:"14px 16px", background:editing && pr.total !== prOld.total ? C.hl : C.primaryDim, borderRadius:"0 0 8px 8px" }}>
            <span style=${{ fontWeight:700, color:C.primary }}>Total Order Value</span>
            <span style=${{ fontWeight:700, fontSize:18, color:C.primary }}>${inr(pr.total)}</span>
          </div>
        <//>

      </div>
    </div>

    ${editing && html`<div className="slide-up" style=${{ position:"fixed", left:0, right:0, bottom:0, zIndex:60, background:C.panel, borderTop:`1px solid ${C.line}`, boxShadow:"0 -8px 20px -10px rgba(16,24,40,.25)" }}>
      <div style=${{ maxWidth:1360, margin:"0 auto", padding:"10px 20px", display:"flex", alignItems:"center", gap:12, flexWrap:"wrap" }}>
        <span style=${{ flex:1, minWidth:180, fontSize:12.5, color:C.sub }}>${dirty ? html`<b style=${{ color:C.ink }}>${changes.length} unsaved change${changes.length === 1 ? "" : "s"}</b> · ${changes.map(c => c[1]).join(", ")}` : "No changes yet"}</span>
        <span style=${{ fontWeight:700, color:C.primary }}>${inr(pr.total)}</span>
        <${Button} variant="secondary" onClick=${() => dirty ? setModal("discard") : discard()}>Discard<//>
        <${Button} icon="Check" disabled=${!qtyOk || (!dirty && !startEditing)} onClick=${dirty ? save : discard}>${!dirty && startEditing ? "Done" : "Save changes"}<//>
      </div>
    </div>`}

    ${modal === "approve" && html`<${ApproveModal} order=${order} pr=${pr} onClose=${() => setModal(null)} onConfirm=${doApprove} />`}
    ${modal === "cancel" && html`<${CancelModal} order=${order} onClose=${() => setModal(null)} onConfirm=${doCancel} />`}
    ${modal === "clone" && html`<${ConfirmModal} icon="Copy" title=${`Clone ${order.id}?`} sub="A new order is created with the same product, quantity, parties, plant and commercial terms. It opens in edit mode so you can adjust it before saving." btn="Clone & open" onClose=${() => setModal(null)} onConfirm=${() => { setModal(null); onClone(order, false); }} />`}
    ${modal === "discard" && html`<${ConfirmModal} icon="Alert" tone=${C.orange} title="Discard changes?" sub=${`${changes.length} change${changes.length === 1 ? "" : "s"} will be lost: ${changes.map(c => c[1]).join(", ")}.`} btn="Discard changes" variant="dangerSolid" onClose=${() => setModal(null)} onConfirm=${() => { setModal(null); discard(); }} />`}
    ${modal === "leave" && html`<${ConfirmModal} icon="Alert" tone=${C.orange} title="Leave without saving?" sub=${`You have ${changes.length} unsaved change${changes.length === 1 ? "" : "s"} on ${order.id}.`} btn="Leave & discard" variant="dangerSolid" onClose=${() => setModal(null)} onConfirm=${() => { setModal(null); guardRef.current = false; onBack(); }} />`}
  </div>`;
}

/* ---------- modals ---------- */
function ConfirmModal({ icon, tone = C.primary, title, sub, btn, variant = "primary", onClose, onConfirm }) {
  return html`<${Modal} onClose=${onClose} width=${460}>
    <${ModalHead} icon=${icon} tone=${tone} title=${title} sub=${sub} onClose=${onClose} />
    <div style=${{ display:"flex", justifyContent:"flex-end", gap:8 }}><${Button} variant="secondary" onClick=${onClose}>Go back<//><${Button} variant=${variant} onClick=${onConfirm}>${btn}<//></div>
  <//>`;
}

function ApproveModal({ order, pr, onClose, onConfirm }) {
  const [ok, setOk] = useState(false); const [note, setNote] = useState("");
  const rows = [["Product", order.product], ["Quantity", `${order.qty} MT`], ["Value per MT", inr(pr.perMt)], ["Supplying Plant", order.plant], ["Buyer", order.buyer], ["Consignee", order.consignee]];
  return html`<${Modal} onClose=${onClose} width=${540}>
    <${ModalHead} icon="CheckCircle" tone=${C.green} title=${`Approve ${order.id}`} sub="Approving creates the SAP Sales Order. After that, the order can't be edited or cancelled here." onClose=${onClose} />
    <div style=${{ border:`1px solid ${C.line}`, borderRadius:8, overflow:"hidden", marginBottom:14 }}>
      ${rows.map(([l, v], i) => html`<div key=${l} style=${{ display:"grid", gridTemplateColumns:"130px 1fr", gap:10, padding:"8px 12px", fontSize:12.5, background:i % 2 ? C.panel : "#FAFCFE", borderTop:i ? `1px solid ${C.line}` : "none" }}><span style=${{ color:C.sub }}>${l}</span><span style=${{ fontWeight:500, wordBreak:"break-word" }}>${v}</span></div>`)}
      <div style=${{ display:"flex", justifyContent:"space-between", padding:"10px 12px", background:C.primaryDim, fontWeight:700, color:C.primary }}><span>Total Order Value</span><span>${inr(pr.total)}</span></div>
    </div>
    <label style=${labelStyle}>Comment (optional)</label>
    <textarea rows="2" value=${note} onInput=${e => setNote(e.target.value)} placeholder="Add a note for the order history…" style=${{ ...inputStyle, resize:"vertical" }} />
    <label style=${{ display:"flex", gap:10, alignItems:"flex-start", marginTop:14, fontSize:12.5, cursor:"pointer", lineHeight:1.45 }}>
      <input type="checkbox" checked=${ok} onChange=${e => setOk(e.target.checked)} style=${{ marginTop:2, width:16, height:16, accentColor:C.green }} />
      I've checked the price, quantity, plant, buyer and consignee.
    </label>
    <div style=${{ display:"flex", justifyContent:"flex-end", gap:8, marginTop:18 }}><${Button} variant="secondary" onClick=${onClose}>Go back<//><${Button} variant="success" icon="Check" disabled=${!ok} onClick=${() => onConfirm(note.trim())}>Confirm Approve<//></div>
  <//>`;
}

function CancelModal({ order, onClose, onConfirm }) {
  const [reason, setReason] = useState(""); const [note, setNote] = useState(""); const [clone, setClone] = useState(false);
  const ok = reason && (reason !== "Other" || note.trim());
  return html`<${Modal} onClose=${onClose} width=${500}>
    <${ModalHead} icon="XCircle" tone=${C.red} title=${`Cancel ${order.id}`} sub=${`${order.qty} MT · ${order.customerName}. Cancelling can't be undone. The customer is notified.`} onClose=${onClose} />
    <label style=${labelStyle}>Reason for cancellation<span style=${{ color:C.red }}> *</span></label>
    <select value=${reason} onChange=${e => setReason(e.target.value)} style=${{ ...inputStyle, marginBottom:12 }}><option value="">Select a reason</option>${CANCEL_REASONS.map(r => html`<option key=${r}>${r}</option>`)}</select>
    <label style=${labelStyle}>Remarks${reason === "Other" && html`<span style=${{ color:C.red }}> *</span>`}</label>
    <textarea rows="3" className="danger-ring" value=${note} onInput=${e => setNote(e.target.value)} placeholder="Add detail for the order history…" style=${{ ...inputStyle, resize:"vertical" }} />
    <label style=${{ display:"flex", gap:10, alignItems:"flex-start", marginTop:14, fontSize:12.5, cursor:"pointer", lineHeight:1.45, padding:"10px 12px", background:C.panelAlt, borderRadius:6 }}>
      <input type="checkbox" checked=${clone} onChange=${e => setClone(e.target.checked)} style=${{ marginTop:2, width:16, height:16 }} />
      <span><b>Cancel & Clone</b> — create a copy of this order and open it for editing</span>
    </label>
    <div style=${{ display:"flex", justifyContent:"flex-end", gap:8, marginTop:18 }}><${Button} variant="secondary" onClick=${onClose}>Keep order<//><${Button} variant="dangerSolid" disabled=${!ok} onClick=${() => onConfirm(reason, note.trim(), clone)}>${clone ? "Cancel & Clone" : "Cancel Order"}<//></div>
  <//>`;
}

/* ============================================================
   APP
   ============================================================ */
function App() {
  const [orders, setOrders] = useState(SEED);
  const [view, setView] = useState({ name:"list" });
  const [loading, setLoading] = useState(false);
  const [toast, setToast] = useState(null);
  const [flashId, setFlashId] = useState(null);
  const counter = useRef(154250); const tT = useRef(); const nT = useRef(); const guardRef = useRef(false);

  const flash = useCallback((text, tone = "info") => { clearTimeout(tT.current); setToast({ text, tone, id:Date.now() }); tT.current = setTimeout(() => setToast(null), 3800); }, []);
  const go = v => { clearTimeout(nT.current); setLoading(true); nT.current = setTimeout(() => { setView(v); setLoading(false); window.scrollTo({ top:0 }); }, 550); };
  const update = o => setOrders(os => os.map(x => x.id === o.id ? o : x));
  const clone = (src, fromCancel) => {
    const id = "DEL0" + counter.current++; const now = new Date();
    const c = { ...src, id, status:src.type === "PI" ? STATUS.PI : STATUS.PEND, sapSo:null, cancelReason:undefined, createdAt:now, createdBy:ME,
      logs:[{ ts:now, by:ME, text:`Cloned from ${src.id}` }] };
    setOrders(os => [c, ...os]);
    flash(fromCancel ? `${src.id} cancelled · clone ${id} created` : `Clone ${id} created from ${src.id}`, "ok");
    go({ name:"detail", id, edit:true });
  };
  const back = id => { go({ name:"list" }); setTimeout(() => { setFlashId(id); setTimeout(() => setFlashId(null), 2600); }, 560); };

  const order = view.name === "detail" ? orders.find(o => o.id === view.id) : null;
  return html`<div>
    <${TopBar} />
    <div className="page-shell">
      ${view.name === "list"
        ? html`<${Listing} orders=${orders} flashId=${flashId} flash=${flash} onView=${id => go({ name:"detail", id })} />`
        : html`<${DetailView} key=${order.id + (view.edit ? "-e" : "")} order=${order} startEditing=${view.edit} guardRef=${guardRef}
            onBack=${() => back(order.id)} onUpdate=${update} onClone=${clone} flash=${flash} />`}
    </div>
    ${toast && html`<${Toast} toast=${toast} />`}
    ${loading && html`<div className="page-loader" role="status"><div className="loader-mark"><img src=${LOGO} alt="" /></div><span className="loader-label">Loading…</span></div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body></html>
