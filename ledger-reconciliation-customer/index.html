<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledger Reconciliation – Customer View Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
<style>
/* Single light theme on purpose: mirrors the client's existing light enterprise UI (same as the other VMB prototypes). */
:root { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #F4F5F7; }
body { font-family: 'Roboto', Arial, sans-serif; color: #1F1F1F; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; }
:focus-visible { outline: 2px solid #1565C0; outline-offset: 2px; }

.viewbar { background: #0B2545; color: #fff; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 7px 20px; font-size: 13px; }
.viewbar a { color: #fff; text-decoration: none; padding: 4px 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,.35); }
.viewbar a.on { background: #fff; color: #0B2545; font-weight: 700; border-color: #fff; }
.viewbar a:not(.on):hover { background: rgba(255,255,255,.12); }

.topbar { background: #fff; display: flex; align-items: center; flex-wrap: wrap; gap: 14px 26px; padding: 10px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.brand { display: flex; align-items: center; gap: 8px; }
.brand img { width: 34px; height: 34px; }
.brand b { font-size: 22px; color: #1565C0; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: #3C4043; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 500; }
.proto-pill { font-size: 11px; font-weight: 700; color: #7A4B00; background: #FFF3E0; border: 1px solid #F0C36D; border-radius: 4px; padding: 3px 8px; white-space: nowrap; }

main { max-width: 1440px; margin: 0 auto; padding: 14px 20px 60px; display: flex; flex-direction: column; gap: 14px; }
.tabs { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.tab { height: 46px; min-width: 120px; padding: 0 18px; border: 1px solid #1F1F1F; border-radius: 3px; background: #fff; font-weight: 700; font-size: 15px; color: #1F1F1F; cursor: pointer; }
.tab.on { background: #1565C0; border-color: #1565C0; color: #fff; }

.card { background: #fff; border-radius: 6px; }
.headcard { padding: 16px 18px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 28px; }
.hk { display: flex; flex-direction: column; gap: 3px; }
.hk span { font-size: 13px; color: #5F6368; }
.hk b { font-size: 17px; font-weight: 500; }
.fld { display: flex; flex-direction: column; gap: 5px; }
.fld label { font-size: 12px; color: #3C4043; }
.ctl { height: 38px; border: 1px solid #1F1F1F; border-radius: 2px; background: #fff; padding: 0 10px; font-size: 13px; color: #1F1F1F; }
.pager { display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 13px; }
.pg { border: 0; background: none; font-weight: 700; font-size: 13px; color: #1F1F1F; cursor: pointer; padding: 3px 7px; border-radius: 3px; }
.pg.on { background: #3C4043; color: #fff; }
.pg.last { color: #1565C0; }
.pg:disabled { color: #9AA0A6; cursor: not-allowed; }

.banner { display: flex; gap: 10px; align-items: flex-start; background: #E3EEFA; border: 1px solid #C7DEF4; border-radius: 6px; padding: 12px 14px; font-size: 14px; line-height: 1.45; }
.banner b { color: #0D47A1; }

.rec { padding: 18px 18px; }
.rline { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.kv { display: flex; flex-direction: column; gap: 3px; padding-right: 16px; border-right: 1px solid #DADCE0; }
.kv:nth-child(3) { border-right: 0; }
.kv span { font-size: 13px; color: #3C4043; }
.kv b { font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rright { display: flex; align-items: center; gap: 14px; margin-left: auto; }
.pill { display: inline-flex; align-items: center; height: 36px; padding: 0 12px; border-radius: 4px; font-size: 15px; white-space: nowrap; }
.p-verified { background: #E8F5E9; color: #2E7D32; }
.p-pending { background: #FFF3E0; color: #8A4B00; }
.p-disputed { background: #FDECEA; color: #B3261E; }
.p-exception { background: #F1EAFB; color: #5B2E91; }
.exp { width: 22px; height: 22px; border: 0; border-radius: 2px; background: #1565C0; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }

.steps { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 14px; font-size: 13px; }
.step { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 16px; background: #F1F2F4; color: #3C4043; }
.step i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #DADCE0; color: #3C4043; }
.step.done { background: #E8F5E9; color: #1B5E20; }
.step.done i { background: #2E7D32; color: #fff; }
.step.bad { background: #FDECEA; color: #8C1D18; }
.step.bad i { background: #B3261E; color: #fff; }
.step.wait i { background: #F0C36D; color: #5B3A00; }
.arrow { color: #80868B; }

.detail { margin-top: 14px; border: 1px solid #E3E5E8; overflow-x: auto; }
.dgrid { min-width: 1080px; display: grid; grid-template-columns: 1.5fr 1fr 1.4fr 1.5fr 1.6fr 3.2fr; gap: 16px; padding: 14px 16px; font-size: 15px; align-items: start; }
.dgrid.h { background: #EEF0F3; font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 7px; }
.lnk { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; font-weight: 500; font-size: 15px; color: #1565C0; cursor: pointer; text-align: left; }
.lnk:hover { color: #0D47A1; text-decoration: underline; }
.muted { color: #5F6368; }
.small { font-size: 12.5px; }
.overdue { color: #B3261E; font-weight: 500; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.btnO { height: 38px; padding: 0 15px; border: 1px solid #1565C0; border-radius: 3px; background: #fff; color: #1565C0; font-weight: 500; font-size: 15px; cursor: pointer; }
.btnO:hover:not(:disabled) { background: #F1F6FD; }
.btnO:disabled { border-color: #C9CDD3; color: #9AA0A6; cursor: not-allowed; }
.btnP { height: 38px; padding: 0 18px; border: 0; border-radius: 3px; background: #1565C0; color: #fff; font-weight: 500; font-size: 15px; cursor: pointer; }
.btnP:disabled { background: #9DB9DC; cursor: not-allowed; }
.btnR { background: #B3261E; }
.btnR:disabled { background: #E3A9A5; }
.lock { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #5F6368; }

.backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 40; }
.modal { background: #fff; border-radius: 6px; width: 100%; max-width: 560px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.modal header { padding: 24px 28px 4px; display: flex; align-items: center; justify-content: space-between; }
.modal header h2 { margin: 0; font-size: 18px; font-weight: 700; }
.modal .body { padding: 8px 28px 4px; display: flex; flex-direction: column; gap: 14px; font-size: 15px; }
.modal .intro { margin: 0; line-height: 1.5; color: #1F1F1F; }
.modal footer { padding: 18px 28px 24px; display: flex; justify-content: flex-end; align-items: center; gap: 22px; }
.modal label.t { font-weight: 700; font-size: 15px; }
.modal textarea { border: 1px solid #1F1F1F !important; border-radius: 3px !important; min-height: 78px !important; }
.upbox { border: 1px dashed #1565C0; border-radius: 3px; padding: 16px 40px; display: flex; flex-direction: column; gap: 6px; }
.upbtn { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; padding: 0 10px; border: 1px solid #1565C0; border-radius: 3px; color: #1565C0; font-weight: 700; font-size: 15px; cursor: pointer; background: #fff; }
label.upbtn { justify-content: flex-start; }
.upname { display: inline-flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.upx { border: 0; background: none; color: #D93025; cursor: pointer; padding: 4px; display: flex; }
.sr { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.txtbtn { border: 0; background: none; font-weight: 700; font-size: 15px; cursor: pointer; padding: 8px 4px; color: #1F1F1F; }
.uptoast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: #F1FAF1; color: #1F1F1F; border: 1px solid #6EBE3C; border-radius: 4px; padding: 12px 18px; font-size: 14px; z-index: 70; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
.sumbox { background: #F5F6F8; border-radius: 6px; padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.sumbox span { display: block; font-size: 12px; color: #5F6368; }
.sumbox b { font-size: 15px; font-variant-numeric: tabular-nums; }
.modal label.t { font-size: 15px; font-weight: 700; }
.modal textarea { width: 100%; min-height: 90px; border: 1px solid #C9CDD3; border-radius: 4px; padding: 8px 10px; font-size: 14px; resize: vertical; }
.modal textarea:focus, .modal input[type=file]:focus { outline: none; border-color: #1565C0; box-shadow: 0 0 0 3px rgba(21,101,192,.14); }
.drop { border: 1px dashed #9AA0A6; border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.err { color: #B3261E; font-size: 12.5px; }
.okfile { color: #1B5E20; font-size: 13px; }
.chkline { display: flex; gap: 10px; align-items: flex-start; }
.chkline input { width: 17px; height: 17px; margin: 2px 0 0; accent-color: #1565C0; flex: none; }
.x { border: 0; background: none; cursor: pointer; padding: 4px; color: #1F1F1F; display: flex; }

.toast { position: fixed; right: 24px; bottom: 24px; background: #1F1F1F; color: #fff; font-size: 14px; padding: 12px 16px; border-radius: 4px; box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 60; max-width: 420px; }
@media (max-width: 720px) { .hide-sm { display: none; } .pager { margin-left: 0; } }
</style>
</head>

  { id: 'hy1-26', durShort: 'Apr 2026-Sep 2026', dur: 'HY1 (Apr – Sep 2026)', asOn: '30-Sep-2026', ob: -1103228.16, cb: -1360368.16, verifyBy: '10-Nov-2026', status: 'Pending',
    uploaded: '', verifiedFile: '', remarks: [], cust: null, supplier: null },
  { id: 'hy2-26', durShort: 'Oct 2025-Mar 2026', dur: 'HY2 (Oct 2025 – Mar 2026)', asOn: '31-Mar-2026', ob: -16802989.16, cb: -1103228.16, verifyBy: '10-Apr-2026', status: 'Verified',
    uploaded: 'BC_777_Mar2026_signed.pdf', verifiedFile: 'HZL_Verified_777_Mar2026.pdf', remarks: [['Customer', 'Balance confirmed as per our books', '04-Apr-2026']],
    cust: { act: 'verified', at: '04-Apr-2026 11:20' }, supplier: { at: '07-Apr-2026 16:05' } },
  { id: 'hy1-25', durShort: 'Apr 2025-Sep 2025', dur: 'HY1 (Apr – Sep 2025)', asOn: '30-Sep-2025', ob: -9845120.40, cb: -16802989.16, verifyBy: '10-Oct-2025', status: 'Disputed',
    uploaded: 'Dispute_777_Sep2025.pdf', verifiedFile: '', remarks: [['Customer', 'Payment of ₹ 4,50,000 on 28-Sep-2025 not credited', '08-Oct-2025'], ['HZL', 'Under review with collections team', '12-Oct-2025']],
    cust: { act: 'disputed', at: '08-Oct-2025 15:42' }, supplier: null },
  { id: 'hy2-25', durShort: 'Oct 2024-Mar 2025', dur: 'HY2 (Oct 2024 – Mar 2025)', asOn: '31-Mar-2025', ob: -7210400.00, cb: -9845120.40, verifyBy: '10-Apr-2025', status: 'Verified',
    uploaded: 'BC_777_Mar2025_signed.pdf', verifiedFile: 'HZL_Verified_777_Mar2025.pdf', remarks: [],
    cust: { act: 'verified', at: '03-Apr-2025 10:05' }, supplier: { at: '05-Apr-2025 12:30' } }
];
const PILL = { 'Verified': 'p-verified', 'Pending': 'p-pending', 'Disputed': 'p-disputed', 'Exception Raised': 'p-exception' };
const PER = 6;
const TYPES = ['.csv', '.xlsx', '.txt', '.doc', '.docx', '.jpg', '.png', '.jpeg', '.pdf'];
const ACCEPT = TYPES.join(',');

const sv = (d, s = 16, w = 2.4) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  dl: '<path d="M12 3v12M7 10l5 5 5-5M4 19h16"/>', plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M5 12h14"/>',
  up: '<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>', lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  bell: '<path d="M6 16V11a6 6 0 1112 0v5l2 2H4z"/><path d="M10 20a2 2 0 004 0"/>', info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>'
};

const S = { durF: 'All', statusF: 'All', page: 0, open: { 'hy1-26': true }, modal: null, file: null, fileErr: '', text: '', toast: '', upToast: '' };
let toastTimer, upTimer;
const set = (p) => { Object.assign(S, p); render(); };
const flash = (m) => { clearTimeout(toastTimer); set({ toast: m }); toastTimer = setTimeout(() => set({ toast: '' }), 3000); };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inr = (n) => '₹ ' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const now = () => { const d = new Date(); return TODAY + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const byId = (id) => RECS.find((r) => r.id === id);

function steps(r) {
  const c = r.cust, s = r.supplier;
  const one = !c ? `<span class="step wait"><i>1</i>Your confirmation – pending</span>`
    : c.act === 'verified' ? `<span class="step done"><i>✓</i>Verified by you · ${c.at}</span>`
    : `<span class="step bad"><i>!</i>Disputed by you · ${c.at}</span>`;
  const two = s ? `<span class="step done"><i>✓</i>Verified by HZL · ${s.at}</span>`
    : !c ? `<span class="step"><i>2</i>HZL verification</span>`
    : c.act === 'verified' ? `<span class="step wait"><i>2</i>HZL verification – in progress</span>`
    : `<span class="step wait"><i>2</i>HZL reviewing your dispute</span>`;
  return `<div class="steps">${one}<span class="arrow" aria-hidden="true">→</span>${two}</div>`;
}

function rowHtml(r) {
  const open = !!S.open[r.id];
  const locked = !!r.cust;
  const fileBtn = (name, label) => name ? `<button class="lnk" data-act="toast" data-msg="Download started – ${esc(name)}">${sv(I.dl, 14, 2.6)}${esc(label || name)}</button>` : '<span>----</span>';
  const remarks = r.remarks.length ? r.remarks.map((m) => `<div><b style="font-weight:500">${m[0]}:</b> ${esc(m[1])}<div class="muted small">${m[2]}</div></div>`).join('') : '<span>----</span>';
  return `<section class="card rec">
    <div class="rline">
      <div class="kv"><span>Duration</span><b>${r.dur}</b></div>
      <div class="kv"><span>Opening Balance</span><b>${inr(r.ob)}</b></div>
      <div class="kv"><span>Closing Balance</span><b>${inr(r.cb)}</b></div>
      <div class="rright">
        <span class="pill ${PILL[r.status]}">${r.status}</span>
        <button class="exp" data-act="row" data-id="${r.id}" aria-expanded="${open}" aria-label="${open ? 'Collapse' : 'Expand'} ${r.dur}">${sv(open ? I.minus : I.plus, 14, 3.4)}</button>
      </div>
    </div>
    ${open ? `${steps(r)}
    <div class="detail">
      <div class="dgrid h"><span>Ledger Report</span><span>Verify By</span><span>Uploaded File</span><span>Verified Customer's File</span><span>Remarks</span><span>Action</span></div>
      <div class="dgrid">
        <div class="stack">
          <button class="lnk" data-act="toast" data-msg="Download started – Ledger ${r.dur}">${sv(I.dl, 14, 2.6)}Download</button>
          <button class="lnk" data-act="toast" data-msg="Download started – Balance Confirmation as on ${r.asOn}">${sv(I.dl, 14, 2.6)}Balance Confirmation</button>
        </div>
        <div class="stack"><span>${r.verifyBy}</span>${!locked && r.id === 'hy1-26' ? '<span class="muted small">15 days left</span>' : ''}</div>
        <div class="stack">${fileBtn(r.uploaded)}</div>
        <div class="stack">${fileBtn(r.verifiedFile)}</div>
        <div class="stack" style="gap:10px">${remarks}</div>
        <div class="stack">
          <div class="acts">
            <button class="btnO" data-act="open" data-m="verify" data-id="${r.id}"${locked ? ' disabled' : ''}>Verify</button>
            <button class="btnO" data-act="open" data-m="dispute" data-id="${r.id}"${locked ? ' disabled' : ''}>Raise Dispute</button>
            <button class="btnO" data-act="open" data-m="remark" data-id="${r.id}">Add Remark</button>
          </div>
          ${locked ? `<span class="lock">${sv(I.lock, 14, 2.2)}${r.cust.act === 'verified' ? 'Verified' : 'Disputed'} on ${r.cust.at} – locked</span>` : ''}
        </div>
      </div>
    </div>` : ''}
  </section>`;
}

function modalHtml() {
  if (!S.modal) return '';
  const r = byId(S.modal.id), m = S.modal.m;
  const upload = `<div class="upbox">
      ${S.file
        ? `<div class="upbtn up-has"><span class="upname">${sv(I.up, 16, 2.4)}${esc(S.file)}</span><button class="upx" data-act="rmfile" aria-label="Remove file">${sv(I.x, 14, 2.6)}</button></div>`
        : `<label class="upbtn" for="fup">${sv(I.up, 16, 2.4)}Upload File*</label>`}
      <input id="fup" type="file" accept="${ACCEPT}" class="sr">
      <span class="small">(*File Type ${TYPES.join(', ')})</span>
      ${S.fileErr ? `<span class="err">${S.fileErr}</span>` : ''}
    </div>`;
  const remarks = `<div class="stack"><label class="t" for="txt">Remarks</label>
      <textarea id="txt" placeholder="Enter your remarks if any...">${esc(S.text)}</textarea></div>`;
  let title, intro, ok;
  if (m === 'verify') {
    title = 'Verify Confirmation';
    intro = `I have duly verified the ledger and it is correct in all aspects. I confirm that no discrepancy will be raised from ${r.durShort}`;
    ok = 'Verify';
  } else if (m === 'dispute') {
    title = 'Raise Dispute';
    intro = 'You can upload a CSV file and remark on Financial Ledger Discrepancies and Auditing Issues.';
    ok = 'Raise Dispute';
  } else {
    title = 'Add Remark';
    intro = `Add a remark for HZL on ${r.durShort}.`;
    ok = 'Add Remark';
  }
  const body = m === 'remark'
    ? `<p class="intro">${intro}</p><div class="stack"><label class="t" for="txt">Remarks</label><textarea id="txt" placeholder="Enter your remarks...">${esc(S.text)}</textarea></div>`
    : `<p class="intro">${intro}</p>${remarks}${upload}`;
  const okOn = m === 'remark' ? S.text.trim().length > 0 : !!S.file;
  return `<div class="backdrop" data-act="close-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <header><h2 id="mt">${title}</h2><button class="x" data-act="close" aria-label="Close">${sv(I.x, 20, 3)}</button></header>
    <div class="body">${body}</div>
    <footer><button class="txtbtn" data-act="close">Cancel</button><button class="btnP" data-act="submit"${okOn ? '' : ' disabled'}>${ok}</button></footer>
  </div></div>`;
}

function render() {
  const list = RECS.filter((r) => (S.durF === 'All' || r.dur === S.durF) && (S.statusF === 'All' || r.status === S.statusF));
  const nPages = Math.max(1, Math.ceil(list.length / PER));
  const page = Math.min(S.page, nPages - 1);
  const from = list.length ? page * PER + 1 : 0, to = Math.min(list.length, page * PER + PER);
  const pend = RECS.filter((r) => !r.cust && r.status === 'Pending');
  const sel = (v, c) => (v === c ? ' selected' : '');

  const active = document.activeElement && document.activeElement.id === 'txt';
  const caret = active ? document.activeElement.selectionStart : null;

  document.getElementById('app').innerHTML = `
  <div class="viewbar"><span>Prototype view:</span><a href="../reconciliation-dashboard/">Supplier (HZL Console)</a><a class="on" href="./" aria-current="page">Customer</a></div>
  <header class="topbar">
    <div class="brand"><img src="${LOGO}" alt=""><b>vedanta</b></div>
    <span class="proto-pill hide-sm">Prototype · demo data</span>
    <div style="flex:1 1 10px"></div>
    <div class="hide-sm" style="display:flex;flex-direction:column;gap:2px;text-align:right"><span style="font-size:12px;color:#3C4043">Logged in as</span><span style="font-size:14px;font-weight:500">${CUSTOMER.name} (${CUSTOMER.code})</span></div>
    ${sv(I.bell, 26, 1.8)}
    <span class="avatar">MA</span>
  </header>
  <main>
    <div class="tabs">
      <button class="tab" data-act="soon">Ledger</button>
      <button class="tab on">Ledger Reconciliation</button>
      <button class="tab" data-act="soon">CN/DN</button>
      <span class="proto-pill">REQ-03 · 06 · 07</span>
    </div>

    ${pend.length ? `<div class="banner" role="note"><span style="color:#0D47A1">${sv(I.info, 20, 2)}</span><div><b>Balance confirmation due:</b> please verify or dispute your ledger for ${pend.map((r) => r.dur).join(', ')} by <b>${pend[0].verifyBy}</b>. You received this request by email at the start of the cycle.</div></div>` : ''}

    <section class="card headcard">
      <div class="hk"><span>Customer Name</span><b>${CUSTOMER.name}</b></div>
      <div class="hk"><span>Customer Code</span><b>${CUSTOMER.code}</b></div>
      <div class="fld"><label for="fDur">Duration</label><select id="fDur" class="ctl" data-f="durF"><option value="All"${sel('All', S.durF)}>All</option>${RECS.map((r) => `<option value="${r.dur}"${sel(r.dur, S.durF)}>${r.dur}</option>`).join('')}</select></div>
      <div class="fld"><label for="fSt">Status</label><select id="fSt" class="ctl" data-f="statusF">${['All', 'Pending', 'Verified', 'Disputed', 'Exception Raised'].map((v) => `<option${sel(v, S.statusF)}>${v}</option>`).join('')}</select></div>
      <div class="pager">
        <b>Showing ${from} - ${to} of ${list.length}</b>
        <span style="width:1px;height:18px;background:#DADCE0;margin:0 4px"></span>
        <button class="pg" data-act="page" data-n="0"${page === 0 ? ' disabled' : ''}>FIRST</button>
        ${Array.from({ length: nPages }, (_, i) => `<button class="pg${i === page ? ' on' : ''}" data-act="page" data-n="${i}">${i + 1}</button>`).join('')}
        <button class="pg last" data-act="page" data-n="${nPages - 1}"${page === nPages - 1 ? ' disabled' : ''}>LAST</button>
      </div>
    </section>

    ${list.length ? list.slice(page * PER, page * PER + PER).map(rowHtml).join('') : '<section class="card" style="padding:36px 18px;color:#5F6368">No records match the selected filters.</section>'}
  </main>
  ${modalHtml()}
  ${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}
  ${S.upToast ? `<div class="uptoast" role="status">${esc(S.upToast)}</div>` : ''}`;

  if (active) { const t = document.getElementById('txt'); if (t) { t.focus(); t.setSelectionRange(caret, caret); } }
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'close-bg' && e.target !== el) return;
  switch (act) {
    case 'soon': flash('Existing tab – not part of this prototype'); break;
    case 'row': { const o = Object.assign({}, S.open); o[el.dataset.id] = !o[el.dataset.id]; set({ open: o }); break; }
    case 'page': set({ page: +el.dataset.n }); break;
    case 'toast': flash(el.dataset.msg); break;
    case 'open': set({ modal: { m: el.dataset.m, id: el.dataset.id }, file: null, fileErr: '', text: '' }); break;
    case 'rmfile': set({ file: null, fileErr: '' }); break;
    case 'close': case 'close-bg': set({ modal: null }); break;
    case 'submit': {
      const r = byId(S.modal.id), m = S.modal.m, at = now();
      if (m === 'verify') {
        r.cust = { act: 'verified', at }; r.status = 'Pending'; r.uploaded = S.file;
        r.remarks.push(['Customer', S.text.trim() || 'Ledger verified', TODAY]);
        set({ modal: null }); flash('Thank you. Your confirmation is recorded and sent to HZL for verification.');
      } else if (m === 'dispute') {
        r.cust = { act: 'disputed', at }; r.status = 'Disputed'; r.uploaded = S.file;
        r.remarks.push(['Customer', S.text.trim() || 'Dispute raised – see uploaded file', TODAY]);
        set({ modal: null }); flash('Dispute raised. HZL will review it and respond here.');
      } else {
        r.remarks.push(['Customer', S.text.trim(), TODAY]);
        set({ modal: null }); flash('Remark added.');
      }
      break;
    }
  }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.f) { set({ [el.dataset.f]: el.value, page: 0 }); return; }
  if (el.id === 'fup') {
    const f = el.files && el.files[0];
    if (!f) return;
    const ext = (f.name.match(/\.[^.]+$/) || [''])[0].toLowerCase();
    if (!TYPES.includes(ext)) set({ file: null, fileErr: 'File type not allowed. Use ' + TYPES.join(', ') });
    else if (f.size > 5 * 1024 * 1024) set({ file: null, fileErr: 'File is larger than 5 MB.' });
    else {
      clearTimeout(upTimer); set({ file: f.name, fileErr: '', upToast: f.name + ' has been uploaded successfully.' });
      upTimer = setTimeout(() => set({ upToast: '' }), 2600);
    }
  }
});
document.addEventListener('input', (e) => { if (e.target.id === 'txt') set({ text: e.target.value }); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.modal) set({ modal: null }); });

render();
</script>
</body></html>
